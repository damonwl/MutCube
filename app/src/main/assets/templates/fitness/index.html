<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>训练记录</title><style>
:root{--bg:#f7f7f5;--fg:#171715;--card:#fff;--muted:#777772;--action:#171715;--onaction:#fff;--line:color-mix(in srgb,var(--fg) 13%,transparent);--soft:color-mix(in srgb,var(--fg) 6%,var(--bg))}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px system-ui,sans-serif}button,input,select,textarea{font:inherit;color:inherit}button{border:0;border-radius:12px;padding:11px 15px;background:var(--soft);cursor:pointer}button:disabled{opacity:.45}button:focus-visible{outline:2px solid var(--muted)}input,select,textarea{width:100%;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px}textarea{min-height:76px;resize:vertical}h1,h2,h3,p{margin:0}h1{font-size:24px}h2{font-size:20px}h3{font-size:16px}p{line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere}small,.muted{color:var(--muted);font-size:12px}.top{display:flex;align-items:center;justify-content:space-between;padding:20px 18px 8px;gap:10px}.brand{display:flex;align-items:center;gap:12px}.logo{width:26px;height:26px;border:2px solid var(--muted);border-radius:9px;transform:rotate(24deg);display:grid;place-items:center}.logo:after{content:"";width:13px;height:13px;border:2px solid var(--muted);border-radius:5px}.stack{display:grid;gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:grid;gap:7px;font-size:13px}.notice{padding:12px 14px;background:var(--soft);border-radius:14px;font-size:13px;line-height:1.6}.primary{background:var(--action);color:var(--onaction)}.full{width:100%}.outline{border:1px solid var(--line);background:transparent}.tag{background:var(--soft);padding:5px 9px;border-radius:20px;font-size:11px}.set{display:grid;grid-template-columns:22px 1fr 1fr 1fr 28px;gap:7px;align-items:center;margin-top:8px}.set input{padding:9px 5px;text-align:center}.set button{padding:4px;background:transparent}.set-head{color:var(--muted);font-size:11px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}.calendar button{height:38px;padding:0;background:transparent}.calendar .logged{background:var(--soft);font-weight:600}.calendar .chosen{background:var(--action);color:var(--onaction)}.calendar small{padding:6px 0}.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;padding:10px 8px calc(12px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line);z-index:2}.tabs button{background:transparent;display:grid;justify-items:center;gap:5px;color:var(--muted);font-size:12px;padding:7px 22px}.tabs button.active{background:var(--soft);color:var(--fg)}svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}main{padding:12px 18px 106px}#status{padding:8px 18px;font-size:13px;color:var(--muted);white-space:pre-wrap}.error{color:var(--fg)!important}.sheet{position:fixed;inset:0;background:#0006;z-index:5;display:flex;align-items:flex-end;padding-top:30px}.sheet-card{width:100%;max-height:90%;overflow-y:auto;padding:22px;background:var(--card);border-radius:26px 26px 0 0;display:grid;gap:14px;padding-bottom:calc(22px + env(safe-area-inset-bottom))}.sheet-card button{text-align:center}.empty{padding:24px 4px;text-align:center;display:grid;gap:12px}.spinner{display:inline-block;width:12px;height:12px;border:2px solid var(--muted);border-top-color:transparent;border-radius:50%;animation:spin 1s linear infinite;margin-right:7px}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.spinner{animation:none}}
.set .value-cell{width:100%;min-height:44px;padding:7px 3px;border:1px solid var(--line);border-radius:12px;background:var(--bg);font-weight:600}.set .value-cell.unset{color:var(--muted);font-weight:400}.stepper{display:grid;grid-template-columns:56px 1fr 56px;gap:10px;align-items:center}.stepper button{height:52px;font-size:24px}.stepper input{text-align:center;font-size:22px;font-weight:600}.quick-values{display:flex;gap:8px;flex-wrap:wrap}.quick-values button{border:1px solid var(--line)}
</style></head><body>
<header class="top"><div class="brand"><span class="logo" aria-hidden="true"></span><div><h3>训练记录</h3><small>当前项目的健身服务</small></div></div><button id="chat" aria-label="进入项目聊天">讨论计划 ↗</button></header>
<div id="status" role="status" aria-live="polite">正在读取项目数据…</div><main id="content"></main><nav id="tabs" class="tabs" aria-label="模板页面" hidden></nav><div id="overlay"></div>
<script>
'use strict';
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dateKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
let TODAY=dateKey(new Date());const tomorrow=()=>{const d=new Date();d.setDate(d.getDate()+1);return dateKey(d)};
function nextTrainingDate(recordDate){const d=new Date(recordDate+'T12:00:00');d.setDate(d.getDate()+1);const next=dateKey(d);return next<TODAY?TODAY:next}
const pending=new Map();let profile=null,current={revision:0,key:null,data:null},draftRow=null,draft=null,draftRows=[],logs=[],allLogs=[],candidates=[],page='train',busy=false;
let profileMode='choose',profileEntry=null,profileDialogue=[],profilePending='',intakeRow=null,intakeSaved='',intakeTimer=null,intakeQueue=Promise.resolve(),intakeId=crypto.randomUUID();
const profileIds={heightCm:'height',weightKg:'weight',goal:'goal',split:'split',weeklyDays:'weekly',experience:'experience',equipment:'equipment',limitations:'limitations',estimatedLoads:'loads'};
function emptyProfile(){return {heightCm:'',weightKg:'',goal:'增肌与力量',split:'3',weeklyDays:'3',experience:'',equipment:'',limitations:'',estimatedLoads:''}}
function captureProfile(){if(profileMode==='form'&&$('height'))profileEntry=Object.fromEntries(Object.entries(profileIds).map(([k,id])=>[k,$(id).value]))}
function profileTurns(){let turns=profileDialogue.slice(-24);while(turns.length>2&&JSON.stringify(turns).length>24000)turns=turns.slice(1);return turns}
async function flushProfile(){clearTimeout(intakeTimer);intakeQueue=intakeQueue.catch(()=>{}).then(async()=>{if(!profileEntry)return;const snapshot=JSON.stringify({form:profileEntry,dialogue:profileTurns(),mode:profileMode,pending:profilePending});if(snapshot===intakeSaved)return;const r=intakeRow?await run('profile.draft_update',{key:intakeRow.key,expectedRevision:intakeRow.revision,data:JSON.parse(snapshot)}):await run('profile.draft_save',JSON.parse(snapshot),intakeId);intakeRow=r.data;intakeSaved=snapshot});return intakeQueue}
function queueProfileSave(){clearTimeout(intakeTimer);intakeTimer=setTimeout(()=>flushProfile().catch(e=>status('资料草稿保存失败：'+e.message,true)),800)}
let selectedDate=TODAY,month=new Date(new Date().getFullYear(),new Date().getMonth(),1),savedDraft='',draftSaveId=crypto.randomUUID(),saveTimer=null,saveQueue=Promise.resolve(),sheetDecision=null,targetDate=TODAY;
function status(text,error=false){$('status').textContent=text;$('status').className=error?'error':''}
function send(capability,input,requestId=crypto.randomUUID()){
 return new Promise((resolve,reject)=>{const timer=setTimeout(()=>{pending.delete(requestId);reject(Error('操作超时；输入可能已经保存，请刷新并查看运行记录，避免重复提交。'))},220000);pending.set(requestId,{resolve,reject,timer});
 try{MutCube.postMessage(JSON.stringify({protocolVersion:2,requestId,capability,...(input?{input}:{})}))}catch(e){clearTimeout(timer);pending.delete(requestId);reject(e)}});
}
MutCube.onmessage=e=>{const reply=JSON.parse(e.data),p=pending.get(reply.requestId);if(!p)return;clearTimeout(p.timer);pending.delete(reply.requestId);reply.error?p.reject(Error(reply.error)):p.resolve(reply.result)};
const run=(actionId,data={},id)=>send('action.run',{actionId,data},id);
function disable(value){document.querySelectorAll('button,input,select,textarea').forEach(e=>e.disabled=value)}
async function task(fn){if(busy)return;busy=true;disable(true);try{await fn()}catch(e){status(e.message,true)}finally{busy=false;disable(false)}}
async function listAll(actionId){const rows=[],seen=new Set();let cursor={};for(;;){const r=(await run(actionId,cursor)).data;for(const row of r.records){if(seen.has(row.key))throw Error('历史分页重复，请刷新重试');seen.add(row.key);rows.push(row)}if(!r.next)break;const next=JSON.stringify(r.next);if(next===JSON.stringify(cursor))throw Error('历史分页没有进展');cursor=r.next}return rows}
function effectiveTraining(rows){const dates=new Set();return [...rows].sort((a,b)=>b.updatedAt-a.updatedAt||b.key.localeCompare(a.key)).filter(row=>{if(dates.has(row.data.date))return false;dates.add(row.data.date);return true})}
async function loadTraining(){allLogs=await listAll('training.list');logs=effectiveTraining(allLogs)}
function validDate(s){if(!/^\d{4}-\d{2}-\d{2}$/.test(s))return false;const d=new Date(s+'T12:00:00');return Number.isFinite(d.getTime())&&dateKey(d)===s}
function validatePlan(p){
 if(!p||typeof p.name!=='string'||!p.name.trim()||!validDate(p.targetDate)||!Array.isArray(p.exercises)||p.exercises.length<1||p.exercises.length>12)throw Error('候选计划不完整，请重新生成');
 const ids=new Set();for(const a of p.exercises){if(!a.id||!a.name?.trim()||ids.has(a.id))throw Error('候选动作名称或标识不合法');ids.add(a.id);
 if(!Number.isFinite(a.weightKg)||a.weightKg<0||a.weightKg>500||!Number.isInteger(a.sets)||a.sets<1||a.sets>12||!Number.isInteger(a.repsMin)||!Number.isInteger(a.repsMax)||a.repsMin<1||a.repsMax>100||a.repsMin>a.repsMax||!Number.isFinite(a.rirMin)||!Number.isFinite(a.rirMax)||a.rirMin<0||a.rirMax>10||a.rirMin>a.rirMax)throw Error('候选动作目标超出合理录入范围，请重新生成')}
 return p;
}
function newDraft(){if(!current.data)return null;validatePlan(current.data);return {date:TODAY,planKey:current.key,plan:current.data,exercises:current.data.exercises.map(a=>({exerciseId:a.id,name:a.name,sets:Array.from({length:a.sets},()=>({weightKg:String(a.weightKg),reps:'',rir:''}))})),note:'',submitted:false}}
function meaningful(d=draft){return !!d&&!d.submitted&&(!!d.note.trim()||d.exercises.length!==d.plan.exercises.length||d.exercises.some(a=>{const goal=d.plan.exercises.find(p=>p.id===a.exerciseId);return !goal||a.sets.length!==goal.sets||a.sets.some(s=>s.reps!==''||s.rir!==''||s.weightKg!==String(goal.weightKg))}))}
async function flushDraft(){
 clearTimeout(saveTimer);saveQueue=saveQueue.catch(()=>{}).then(async()=>{if(!draft)return;const snapshot=JSON.stringify(draft);if(snapshot===savedDraft)return;
 const r=draftRow?await run('draft.update',{key:draftRow.key,expectedRevision:draftRow.revision,data:JSON.parse(snapshot)}):await run('draft.save',JSON.parse(snapshot),draftSaveId);
 draftRow=r.data;savedDraft=snapshot;});return saveQueue;
}
async function useCurrentPlanDraft(){
 await flushDraft();draftRows=await listAll('draft.list');
 // A workout is already recorded for this date. Keep the newly confirmed plan,
 // but defer its entry draft until the next day instead of creating a false
 // same-day draft that recovery would immediately mark submitted.
 if(logs.some(r=>r.data.date===TODAY)){draft=null;draftRow=null;savedDraft='';return}
 const existing=draftRows.find(r=>!r.data.submitted&&r.data.date===TODAY&&r.data.planKey===current.key);
 draftRow=existing??null;draft=existing?JSON.parse(JSON.stringify(existing.data)):newDraft();
 savedDraft=existing?JSON.stringify(draft):'';
 if(!existing){draftSaveId=crypto.randomUUID();await flushDraft();draftRows=await listAll('draft.list')}
}
function queueSave(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>flushDraft().then(()=>{if(!busy)status('草稿已保存')}).catch(e=>status('草稿保存失败，请勿离开：'+e.message,true)),800)}
async function refresh(){
 await flushDraft();const previousToday=TODAY;TODAY=dateKey(new Date());
 if(selectedDate===previousToday)selectedDate=TODAY;if(targetDate===previousToday)targetDate=TODAY;
 const p=(await run('profile.list')).data.records;profile=p[0]?.data??null;
 const intake=(await run('profile.draft_list')).data.records;intakeRow=intake[0]??null;
 if(!profile&&intakeRow){profileEntry=intakeRow.data.form;profileDialogue=intakeRow.data.dialogue;profileMode=intakeRow.data.mode;profilePending=intakeRow.data.pending;intakeSaved=JSON.stringify(intakeRow.data)}
 current=(await run('plan.current')).data;if(current.data)validatePlan(current.data);
 draftRows=await listAll('draft.list');draftRow=draftRows[0]??null;draft=draftRow?.data??null;savedDraft=draft?JSON.stringify(draft):'';
 await loadTraining();candidates=await listAll('plan.list');
 if(targetDate===TODAY&&logs.some(r=>r.data.date===TODAY))targetDate=tomorrow();
 // An uncertain submission is recovered from the immutable record, not submitted a second time.
 if(draft&&logs.some(r=>r.data.date===draft.date)&&!draft.submitted){draft.submitted=true;await flushDraft()}
 if(!profile)page='profile';else if(page==='profile')page='train';
 // A confirmed version is a one-day plan, not a repeating schedule. Once used in a
 // submitted workout, reopening tomorrow must not silently turn it into a new draft.
 if(draft&&!draft.submitted&&current.key&&logs.some(r=>r.data.planKey===current.key)&&draft.planKey===current.key&&!meaningful()){
  draft=null;draftRow=null;savedDraft='';
 }
 if(!draft||draft.submitted){draft=logs.some(r=>r.data.date===TODAY||r.data.planKey===current.key)?null:newDraft();draftRow=null;savedDraft='';draftSaveId=crypto.randomUUID()}
 render();status('已读取当前项目数据');
}
function icon(name){const paths={train:'M4 8v8M7 6v12M17 6v12M20 8v8M7 12h10',calendar:'M4 5h16v15H4zM8 3v4M16 3v4M4 10h16',mine:'M5 21v-3a7 7 0 0 1 14 0v3M12 3a4 4 0 1 0 0 8 4 4 0 0 0 0-8'};return `<svg viewBox="0 0 24 24"><path d="${paths[name]}"/></svg>`}
function render(){
 $('content').innerHTML='';$('tabs').hidden=!profile;
 $('tabs').innerHTML=profile?['train','calendar','mine'].map((p,i)=>`<button data-page="${p}" class="${page===p?'active':''}">${icon(p)}${['训练','记录','我的'][i]}</button>`).join(''):'';
 if(page==='profile')renderProfile();if(page==='train')renderTrain();if(page==='calendar')renderCalendar();if(page==='mine')renderMine();if(busy)disable(true);
}
function renderProfile(){
 if(!profileEntry)profileEntry=profile?Object.fromEntries(Object.keys(emptyProfile()).map(k=>[k,String(profile[k]??'')])):emptyProfile();
 if(profileMode==='form'){renderProfileForm();return}
 $('content').innerHTML=profileMode==='choose'?`<div class="stack"><h1>如何录入训练资料？</h1><p class="muted">填写或交流都可以，核对后才保存为正式资料。</p><div class="card stack"><h2>和 AI 交流</h2><p>自然描述你的情况，AI 整理已有信息并补问缺失项。</p><button id="startProfileAi" class="primary">和 AI 交流 · 推荐</button></div><button id="startProfileForm" class="outline">直接填写</button></div>`:`<div class="stack"><div class="row"><h1>和 AI 整理资料</h1><button id="startProfileForm" class="outline">切换填写</button></div><div class="notice">AI 可参考本项目已有会话。资料需核对，不会直接保存或改变计划。</div><div class="card stack">${profileDialogue.length?profileDialogue.map(t=>`<div><small>${t.role==='user'?'你':'AI'}</small><p>${esc(t.text)}</p></div>`).join(''):'<p>可以一次说完身高、体重、训练分化和偏好。不了解工作重量可以不填。</p>'}</div><label>补充你的情况<textarea id="profileInput" placeholder="例如：我身高190厘米，体重94公斤，每周练三天，希望三分化增肌。"></textarea></label><button id="sendProfileAi" class="primary">${profileDialogue.length?'继续交流':'整理资料'}</button><button id="reviewProfile" class="outline">核对并保存资料</button></div>`;
 const toForm=()=>task(async()=>{await flushProfile();profileMode='form';render();await flushProfile()});
 $('startProfileForm').onclick=toForm;if($('reviewProfile'))$('reviewProfile').onclick=toForm;
 if($('startProfileAi'))$('startProfileAi').onclick=()=>task(async()=>{profileMode='ai';render();await flushProfile()});
 if($('profileInput')){$('profileInput').value=profilePending;$('profileInput').oninput=()=>{profilePending=$('profileInput').value;queueProfileSave()}};
 if($('sendProfileAi'))$('sendProfileAi').onclick=()=>task(async()=>{
  const typed=$('profileInput').value.trim(),request=typed||(profileDialogue.at(-1)?.role==='user'?profileDialogue.at(-1).text:'');if(!request)throw Error('请先描述或补充你的情况');if(request.length>8000)throw Error('单次描述请控制在8000字以内');
  if(typed)profileDialogue.push({role:'user',text:request});profilePending='';await flushProfile();render();status('AI 正在整理资料…');
  const result=(await run('profile.assist',{request,form:profileEntry,dialogue:JSON.stringify(profileTurns())})).data;
  const fields=result.fields;if(!fields||Object.keys(emptyProfile()).some(k=>typeof fields[k]!=='string'))throw Error('AI 返回的资料不完整，请重试或切换填写');
  if(!['增肌与力量','保持体能','减脂与体能'].includes(fields.goal)||!['1','2','3','4','5'].includes(fields.split)||!['1','2','3','4','5','6'].includes(fields.weeklyDays))throw Error('AI 返回的分化或频率无效，请切换填写核对');
  profileEntry=fields;profileDialogue.push({role:'assistant',text:result.reply});await flushProfile();render();status(result.ready?'资料已整理，请核对并保存':'请补充缺失资料，或切换填写');
 });
}
function renderProfileForm(){const source=profileEntry??profile??emptyProfile(),p={...source,split:Number(source.split),weeklyDays:Number(source.weeklyDays)};
 $('content').innerHTML=`<div class="stack"><div class="stack"><h1>${profile?'编辑基本信息':'先了解你的训练基础'}</h1><p class="muted">不需要测试极限重量。资料用于生成计划，不替代专业评估。</p></div><form id="profileForm" class="card stack"><div class="grid"><label>身高 · cm<input id="height" type="number" min="100" max="250" step="0.1" required value="${esc(p.heightCm)}"></label><label>体重 · kg<input id="weight" type="number" min="20" max="350" step="0.1" required value="${esc(p.weightKg)}"></label></div><label>训练目标<select id="goal">${['增肌与力量','保持体能','减脂与体能'].map(v=>`<option ${v===p.goal?'selected':''}>${v}</option>`).join('')}</select></label><div class="grid"><label>训练分化<select id="split">${[1,2,3,4,5].map(n=>`<option value="${n}" ${n===p.split?'selected':''}>${n===1?'全身训练':n+'分化'}</option>`).join('')}</select></label><label>每周训练天数<select id="weekly">${[1,2,3,4,5,6].map(n=>`<option ${n===p.weeklyDays?'selected':''}>${n}</option>`).join('')}</select></label></div><label>训练经验 · 选填<input id="experience" value="${esc(p.experience)}" placeholder="例如：训练半年，熟悉哑铃动作"></label><label>可用器械 · 选填<input id="equipment" value="${esc(p.equipment)}" placeholder="例如：健身房、哑铃、绳索"></label><label>动作限制与偏好 · 选填<textarea id="limitations" placeholder="例如：腿部暂不加重；避免腰部不适动作">${esc(p.limitations)}</textarea></label><label>熟悉动作的工作重量 · 选填<textarea id="loads" placeholder="推：哑铃卧推；拉：下拉或划船；蹲：高脚杯深蹲；髋铰链：罗马尼亚硬拉。可只填熟悉动作及重量。">${esc(p.estimatedLoads)}</textarea></label><small>哑铃按单只重量，其他动作说明重量口径。不知道可留空。</small><button class="primary full" type="submit">保存基本信息</button>${profile?'<button id="profileCancel" type="button">返回训练</button>':''}</form></div>`;
 $('profileForm').onsubmit=e=>{e.preventDefault();return task(async()=>{const heightCm=Number($('height').value),weightKg=Number($('weight').value);if(heightCm<100||heightCm>250||weightKg<20||weightKg>350)throw Error('请填写有效身高和体重');const data={heightCm,weightKg,goal:$('goal').value,split:Number($('split').value),weeklyDays:Number($('weekly').value),experience:$('experience').value.trim(),equipment:$('equipment').value.trim(),limitations:$('limitations').value.trim(),estimatedLoads:$('loads').value.trim()};await run('profile.save',data);profile=data;page='train';render();status('基本信息已保存；已确认计划不会自动改变')})};
 const form=$('profileForm');form.insertAdjacentHTML('afterbegin','<button id="profileToAi" type="button" class="outline">改用 AI 交流</button>');
 $('profileToAi').onclick=()=>task(async()=>{captureProfile();await flushProfile();profileMode='ai';render();await flushProfile()});
 form.addEventListener('input',()=>{captureProfile();queueProfileSave()});
 form.addEventListener('submit',()=>{captureProfile();queueProfileSave()});
 if($('profileCancel'))$('profileCancel').onclick=()=>task(async()=>{captureProfile();await flushProfile();page='train';render()});
}
function planText(a){return `${a.weightKg===0?'徒手':a.weightKg+' kg'} · ${a.sets} 组 × ${a.repsMin===a.repsMax?a.repsMin:a.repsMin+'–'+a.repsMax} 次 · RIR ${a.rirMin===a.rirMax?a.rirMin:a.rirMin+'–'+a.rirMax}`}
function valueCell(a,i,j,k){const value=a.sets[j][k];return `<button type="button" class="value-cell${value===''?' unset':''}" data-edit-set="${i}:${j}:${k}" aria-label="${esc(a.name)} 第${j+1}组 ${k==='reps'?'实际次数':'实际 RIR'}，${value===''?'未填':esc(value)}">${value===''?'填写':esc(value)}</button>`}

async function generate(request){
 if(!validDate(targetDate))throw Error('请选择有效的计划目标日期');await flushDraft();current=(await run('plan.current')).data;
 const baseRevision=current.revision;status('正在生成计划候选，请稍候…');const r=await run('plan.generate',{request,baseRevision,targetDate});

 const stale=current.revision!==baseRevision;status(stale?'候选已保存，但当前计划在生成期间变化；请重新生成后再启用':'候选已保存，预览并确认后才启用',stale);preview({key:r.key,data:r.data,stale});

function actualTraining(){
 if(!draft||draft.submitted)throw Error('没有可提交草稿');if(!validDate(draft.date)||draft.date>TODAY)throw Error('实际训练日期无效');validatePlan(draft.plan);

 const exercises=draft.exercises.map(a=>({exerciseId:a.exerciseId,name:a.name,sets:a.sets.map(s=>{if(s.weightKg.trim()===''||s.reps.trim()===''||s.rir.trim()==='')throw Error('请填完每个实际组的重量、次数和 RIR；未完成组请删除');const weightKg=Number(s.weightKg),reps=Number(s.reps),rir=Number(s.rir);if(!Number.isFinite(weightKg)||weightKg<0||weightKg>500||!Number.isInteger(reps)||reps<1||reps>200||!Number.isFinite(rir)||rir<0||rir>10)throw Error('实际组数据无效，请检查重量、次数和 RIR');return {weightKg,reps,rir}})}));

}

 $('prevMonth').onclick=()=>{month=new Date(y,m-1,1);renderCalendar()};$('nextMonth').onclick=()=>{month=new Date(y,m+1,1);renderCalendar()};
}
function renderMine(){
 const completedCurrent=!!current.key&&logs.some(r=>r.data.planKey===current.key);
 $('content').innerHTML=`<div class="stack"><h1>我的训练</h1><div class="card stack"><h3>基本信息</h3><p>${profile.heightCm} cm · ${profile.weightKg} kg\n${esc(profile.goal)} · ${profile.split} 分化 · 每周 ${profile.weeklyDays} 天</p><p class="muted">${esc(profile.limitations||'暂无动作限制')}</p><button id="editProfile" class="outline">编辑基本信息</button></div><div class="card stack"><h3>计划与数据</h3><p class="muted">训练记录 ${logs.length} 份\n待执行计划：${completedCurrent?'暂无':esc(current.data?.name??'暂无')}\n${completedCurrent?`上一份已完成：${esc(current.data.name)}\n`:''}修改资料不自动覆盖计划，调整需生成候选并确认。</p><button id="discuss">进入项目聊天讨论</button><small>运行记录、数据导出、授权撤销由宿主菜单提供。</small></div></div>`;
 $('editProfile').onclick=()=>task(async()=>{await flushDraft();profileEntry=Object.fromEntries(Object.keys(emptyProfile()).map(k=>[k,String(profile[k]??'')]));profileMode='form';page='profile';render()});$('discuss').onclick=openChat;
}
async function openChat(){if(busy)return;return task(async()=>{await flushDraft();await send('navigation.openChat')})}
window.MutCubeBeforeLeave=async()=>{
 if(busy){status('操作进行中，请等待完成再离开');return false}
 try{if(page==='profile'){captureProfile();await flushProfile()}await flushDraft();return true}catch(e){status('草稿保存失败，页面已保留：'+e.message,true);return false}
};
$('chat').onclick=async()=>{if(await window.MutCubeBeforeLeave())return openChat()};
$('content').addEventListener('input',e=>{if(!e.target.dataset.field||!draft)return;const [i,j,k]=e.target.dataset.field.split(':');draft.exercises[i].sets[j][k]=e.target.value;queueSave()});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||busy)return;
 if(b.dataset.editSet){editSetValue(b);return}
 if(b.dataset.page)(async()=>{if(page==='profile'&&!await window.MutCubeBeforeLeave())return;return task(async()=>{await flushDraft();page=b.dataset.page;render()})})();
 if(b.dataset.date){selectedDate=b.dataset.date;renderCalendar()}
 if(b.dataset.preview){const row=candidates.find(r=>r.key===b.dataset.preview);if(row)preview(row)}
 if(b.dataset.add!==undefined&&draft){const i=Number(b.dataset.add),a=draft.exercises[i],goal=draft.plan.exercises.find(p=>p.id===a.exerciseId);if(a.sets.length>=12){status('最多录入 12 个实际组');return}a.sets.push({weightKg:String(goal.weightKg),reps:'',rir:''});$('sets-'+i).innerHTML=setRows(a,i);queueSave()}
 if(b.dataset.remove&&draft){const [i,j]=b.dataset.remove.split(':').map(Number),a=draft.exercises[i];if(a.sets.length<=1){status('至少保留一个实际组');return}a.sets.splice(j,1);$('sets-'+i).innerHTML=setRows(a,i);queueSave()}
 if(b.dataset.removeExercise!==undefined&&draft){const i=Number(b.dataset.removeExercise),a=draft.exercises[i];if(!a)return;showSheet(`<h2>移除今天的${esc(a.name)}？</h2><p>仅从今天的实际训练草稿中移除，不修改已启用计划或历史记录。可以在提交前恢复。</p><button id="confirmRemoveExercise" class="primary">移除动作</button><button id="cancelRemoveExercise" class="outline">取消</button>`);$('cancelRemoveExercise').onclick=closeSheet;$('confirmRemoveExercise').onclick=()=>task(async()=>{draft.exercises.splice(i,1);await flushDraft();closeSheet();render();status('已从今天草稿移除动作；可在提交前恢复')})}
 if(b.dataset.restoreExercise!==undefined&&draft){const goal=draft.plan.exercises.find(p=>p.id===b.dataset.restoreExercise);if(!goal||draft.exercises.some(a=>a.exerciseId===goal.id))return;const index=draft.plan.exercises.findIndex(p=>p.id===goal.id),insertAt=draft.exercises.findIndex(a=>draft.plan.exercises.findIndex(p=>p.id===a.exerciseId)>index);draft.exercises.splice(insertAt<0?draft.exercises.length:insertAt,0,{exerciseId:goal.id,name:goal.name,sets:Array.from({length:goal.sets},()=>({weightKg:String(goal.weightKg),reps:'',rir:''}))});task(async()=>{await flushDraft();render();status('动作已恢复，实际次数与 RIR 待填写')})}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!busy)closeSheet()});
let launchReady=false;
async function openLaunchTarget(){const target=window.MutCubeLaunchTarget;if(!launchReady||busy||!target)return;window.MutCubeLaunchTarget=null;
 await task(async()=>{if(target.collection==='plans'){page='train';render();if(target.recordKey){const rows=await listAll('plan.list'),row=rows.find(r=>r.key===target.recordKey);if(row)preview(row);else status('对应计划已不存在，请查看当前计划或运行记录',true)}}else if(target.collection==='training'){page='calendar';render()}else if(target.collection==='profiles'){page=profile?'mine':'profile';render()}})
}
window.addEventListener('mutcube:open-record',openLaunchTarget);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&TODAY!==dateKey(new Date())&&!busy)task(refresh)});
task(refresh).then(()=>{launchReady=true;return openLaunchTarget()});
</script></body></html>
