}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;script&gt;
  const mcRoot = document.getElementById(&#x27;mutcube-mock&#x27;);
  const mcComposer = document.getElementById(&#x27;mc-composer&#x27;);
  const mcMessage = document.getElementById(&#x27;mc-message&#x27;);
  const mcAddSend = document.getElementById(&#x27;mc-add-send&#x27;);
  const mcAttach = document.getElementById(&#x27;mc-attach-sheet&#x27;);
  const mcDrawer = document.getElementById(&#x27;mc-drawer&#x27;);
  const mcScrim = document.getElementById(&#x27;mc-scrim&#x27;);
  const mcStatus = document.getElementById(&#x27;mc-status&#x27;);
  const mcChatTab = document.getElementById(&#x27;mc-chat-tab&#x27;);
  const mcTemplateTab = document.getElementById(&#x27;mc-template-tab&#x27;);
  const mcChatHome = document.getElementById(&#x27;mc-chat-home&#x27;);
  const mcTemplateHome = document.getElementById(&#x27;mc-template-home&#x27;);
  const mcMessages = document.getElementById(&#x27;mc-messages&#x27;);
  const mcComposerZone = document.querySelector(&#x27;.mc-composer-zone&#x27;);
  const mcContextAction = document.getElementById(&#x27;mc-context-action&#x27;);
  const mcTemplateSearch = document.getElementById(&#x27;mc-template-search&#x27;);
  const mcTemplateQuery = document.getElementById(&#x27;mc-template-query&#x27;);
  const mcState = { startup: &#x27;draft&#x27;, composerRadius: 26 };

  function mcRefreshIcons() {
    if (globalThis.lucide) lucide.createIcons({ attrs: { width: 20, height: 20 } });
  }

  function mcSetComposer(expanded) {
    mcComposer.classList.toggle(&#x27;is-expanded&#x27;, expanded);
    mcStatus.textContent = expanded ? &#x27;当前：输入框展开，可选择模型强度、相机、语音和附件。&#x27; : &#x27;当前：空白新对话；未发送内容不会进入历史记录。&#x27;;
  }

  function mcUpdateAction() {
    const hasText = mcMessage.value.trim().length &gt; 0;
    mcAddSend.innerHTML = `&lt;i data-lucide=&quot;${hasText ? &#x27;arrow-up&#x27; : &#x27;plus&#x27;}&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;`;
    mcAddSend.setAttribute(&#x27;aria-label&#x27;, hasText ? &#x27;发送消息&#x27; : &#x27;添加附件&#x27;);
    mcRefreshIcons();
  }

  function mcCloseOverlays() {
    mcAttach.hidden = true;
    mcDrawer.hidden = true;
    mcScrim.hidden = true;
  }

  function mcSelectSurface(template) {
    mcMessages.hidden = true;
    mcChatHome.hidden = template;
    mcTemplateHome.hidden = !template;
    mcComposerZone.hidden = template;
    mcContextAction.innerHTML = `&lt;i data-lucide=&quot;${template ? &#x27;search&#x27; : &#x27;circle-dashed&#x27;}&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;`;
    mcContextAction.setAttribute(&#x27;aria-label&#x27;, template ? &#x27;搜索模板&#x27; : &#x27;预留功能位&#x27;);
    mcContextAction.dataset.tooltip = template ? &#x27;搜索模板&#x27; : &#x27;预留功能位&#x27;;
    if (!template) {
      mcTemplateSearch.hidden = true;
      mcTemplateQuery.value = &#x27;&#x27;;
      document.querySelectorAll(&#x27;.mc-service&#x27;).forEach((item) =&gt; { item.hidden = false; });
    }
    mcChatTab.classList.toggle(&#x27;is-active&#x27;, !template);
    mcTemplateTab.classList.toggle(&#x27;is-active&#x27;, template);
    mcChatTab.setAttribute(&#x27;aria-selected&#x27;, String(!template));
    mcTemplateTab.setAttribute(&#x27;aria-selected&#x27;, String(template));
    mcRefreshIcons();
    mcStatus.textContent = template ? &#x27;当前：模板总览；聊天与模板是平级界面。&#x27; : &#x27;当前：空白新对话；未发送内容不会进入历史记录。&#x27;;
  }

  mcMessage.addEventListener(&#x27;focus&#x27;, () =&gt; mcSetComposer(true));
  mcMessage.addEventListener(&#x27;input&#x27;, mcUpdateAction);
  mcAddSend.addEventListener(&#x27;click&#x27;, () =&gt; {
    if (mcMessage.value.trim()) {
      const text = mcMessage.value.trim();
      mcChatHome.hidden = true;
      mcTemplateHome.hidden = true;
      mcMessages.hidden = false;
      mcMessages.innerHTML = `&lt;div class=&quot;mc-bubble&quot;&gt;&lt;/div&gt;&lt;div class=&quot;mc-reply&quot;&gt;这是交互原型中的回复占位。真实产品中将在这里流式显示模型回答。&lt;/div&gt;`;
      mcMessages.querySelector(&#x27;.mc-bubble&#x27;).textContent = text;
      mcMessage.value = &#x27;&#x27;;
      mcUpdateAction();
      mcSetComposer(false);
      mcStatus.textContent = &#x27;当前：消息已发送，并生成一条对话记录。&#x27;;
      return;
    }
    mcAttach.hidden = false;
    mcScrim.hidden = false;
    mcStatus.textContent = &#x27;当前：附件面板，支持拍照、相册和本地文件。&#x27;;
  });
  document.getElementById(&#x27;mc-menu&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
    mcDrawer.hidden = false;
    mcScrim.hidden = false;
    mcStatus.textContent = &#x27;当前：侧边栏，依次展示品牌、个人信息、项目、新建对话和最近聊天。&#x27;;
  });
  mcScrim.addEventListener(&#x27;click&#x27;, mcCloseOverlays);
  document.getElementById(&#x27;mc-new-chat&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
    mcCloseOverlays(); mcMessage.value = &#x27;&#x27;; mcUpdateAction(); mcSetComposer(false); mcSelectSurface(false);
  });
  mcChatTab.addEventListener(&#x27;click&#x27;, () =&gt; mcSelectSurface(false));
  mcTemplateTab.addEventListener(&#x27;click&#x27;, () =&gt; mcSelectSurface(true));
  mcContextAction.addEventListener(&#x27;click&#x27;, () =&gt; {
    if (mcTemplateHome.hidden) {
      mcStatus.textContent = &#x27;右上角为聊天页预留功能位。&#x27;;
      return;
    }
    mcTemplateSearch.hidden = !mcTemplateSearch.hidden;
    if (!mcTemplateSearch.hidden) mcTemplateQuery.focus();
  });
  document.getElementById(&#x27;mc-close-search&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
    mcTemplateSearch.hidden = true;
    mcTemplateQuery.value = &#x27;&#x27;;
    document.querySelectorAll(&#x27;.mc-service&#x27;).forEach((item) =&gt; { item.hidden = false; });
  });
  mcTemplateQuery.addEventListener(&#x27;input&#x27;, () =&gt; {
    const query = mcTemplateQuery.value.trim().toLowerCase();
    document.querySelectorAll(&#x27;.mc-service&#x27;).forEach((item) =&gt; {
      item.hidden = query.length &gt; 0 &amp;&amp; !item.textContent.toLowerCase().includes(query);
    });
  });
  document.querySelectorAll(&#x27;.mc-attach-actions button&#x27;).forEach((button) =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; {
    mcCloseOverlays();
    mcSetComposer(true);
    mcStatus.textContent = `已选择“${button.textContent.trim()}”，原型不读取真实文件。`;
  }));
  document.querySelectorAll(&#x27;.mc-service&#x27;).forEach((button) =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; {
    mcStatus.textContent = `准备进入“${button.querySelector(&#x27;strong&#x27;).textContent}”模板。`;
  }));

  function mcRenderTweak() {
    mcComposer.style.borderRadius = `${mcState.composerRadius}px`;
    mcStatus.textContent = mcState.startup === &#x27;last&#x27; ? &#x27;启动策略：恢复最近一次对话。&#x27; : &#x27;启动策略：创建不入历史的空白草稿。&#x27;;
  }
  mcRenderTweak();
  mcRefreshIcons();

  if (globalThis.Tweak) {
    const mcTweak = new Tweak({ container: mcRoot, onChange: mcRenderTweak });
    mcTweak.addSelect(mcState, &#x27;startup&#x27;, { label: &#x27;启动页面&#x27;, options: [{label:&#x27;空白新对话&#x27;,value:&#x27;draft&#x27;},{label:&#x27;恢复最近对话&#x27;,value:&#x27;last&#x27;}], reference: &#x27;mutcube.startup&#x27; });
    mcTweak.addSlider(mcState, &#x27;composerRadius&#x27;, { label: &#x27;输入框圆角&#x27;, min: 16, max: 32, unit: &#x27;px&#x27;, reference: &#x27;mutcube.composer.radius&#x27; });
  }
&lt;/script&gt;

    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
