<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MutCube · 健身模板原型</title>
  <style>
    :root{color-scheme:light;--page:#f7f7f5;--surface:#fff;--soft:#efefec;--ink:#171715;--muted:#777772;--line:#e3e3de;--action:#171715;--onaction:#fff;--danger:#b83e35;font-family:"PingFang SC",system-ui,sans-serif}
    :root.dark{color-scheme:dark;--page:#141414;--surface:#222;--soft:#303030;--ink:#f4f4f2;--muted:#b1b1aa;--line:#444;--action:#f4f4f2;--onaction:#171715;--danger:#ffada4}
    *{box-sizing:border-box}body{margin:0;padding:18px 12px;background:#ecece9;color:var(--ink)}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}button:focus-visible,a:focus-visible{outline:2px solid var(--muted);outline-offset:3px}button{border:0;background:var(--soft);border-radius:14px;padding:12px 16px}a{color:inherit}h1,h2,h3,p{margin:0}h1{font-size:24px;letter-spacing:-.7px}h2{font-size:21px}h3{font-size:16px}p{line-height:1.7}.muted,small{color:var(--muted)}small{font-size:12px}.wrap{display:grid;justify-items:center;gap:12px}.tools{display:flex;gap:8px;align-items:center;font-size:12px;flex-wrap:wrap;justify-content:center}.tools button{padding:8px 12px}.phone{width:min(390px,100%);height:min(844px,calc(100dvh - 100px));min-height:610px;background:var(--page);border-radius:34px;overflow:hidden;box-shadow:0 24px 70px #0002;display:flex;flex-direction:column;position:relative;border:1px solid var(--line)}.status{display:flex;justify-content:space-between;padding:14px 24px 4px;font-size:12px}.top{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 14px}.brand{display:flex;gap:8px;align-items:center}.logo{width:26px;height:26px;border:2px solid var(--muted);border-radius:9px;transform:rotate(24deg);display:grid;place-items:center}.logo:after{content:"";width:13px;height:13px;border:2px solid var(--muted);border-radius:5px}.icon{padding:0;width:38px;height:38px;display:grid;place-items:center;background:var(--surface);border-radius:50%}svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.content{overflow-y:auto;flex:1;padding:8px 20px 24px;min-height:0}.stack{display:grid;gap:16px}.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px}.hero{padding:10px 0 4px;display:grid;gap:8px}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.tag{font-size:11px;background:var(--soft);border-radius:20px;padding:5px 9px;white-space:nowrap}.primary{background:var(--action);color:var(--onaction);width:100%}.outline{background:transparent;border:1px solid var(--line)}.footer{padding:10px 20px 12px;background:var(--page);border-top:1px solid var(--line);display:grid;gap:8px}.tabs{display:flex;justify-content:space-around;padding:10px 8px 18px;background:var(--surface);border-top:1px solid var(--line)}.tabs button{background:none;color:var(--muted);font-size:12px;display:grid;justify-items:center;gap:5px;padding:7px 24px}.tabs button.active{color:var(--ink);background:var(--soft)}label{display:grid;gap:7px;font-size:13px}input,select,textarea{width:100%;border:1px solid var(--line);background:var(--page);border-radius:12px;padding:11px;min-width:0}textarea{resize:vertical;min-height:72px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fields{display:grid;gap:14px}.sets{display:grid;gap:8px;margin-top:14px}.set{display:grid;grid-template-columns:25px 1fr 1fr 1fr 25px;gap:7px;align-items:center}.set input{padding:9px 5px;text-align:center}.set button{padding:0;background:none}.set-head{font-size:11px;color:var(--muted)}.notice{padding:13px 15px;background:var(--soft);border-radius:14px;font-size:13px;line-height:1.6}.error{color:var(--danger)}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}.calendar button{padding:0;height:37px;background:transparent;border-radius:12px}.calendar .logged{background:var(--soft);font-weight:600}.calendar .chosen{background:var(--action);color:var(--onaction)}.calendar small{padding:6px 0}.bubble{background:var(--soft);padding:15px;border-radius:18px;font-size:14px;line-height:1.7}.user{background:var(--action);color:var(--onaction);margin-left:40px}.sheet{position:absolute;inset:0;background:#0005;z-index:10;display:flex;align-items:flex-end}.sheet-card{width:100%;padding:22px;background:var(--surface);border-radius:26px 26px 0 0;display:grid;gap:14px}.sheet-card button{text-align:left}.empty{text-align:center;padding:34px 10px;display:grid;gap:12px}.composer{display:flex;gap:8px}.composer input{background:var(--surface)}.composer button{min-width:44px;padding:8px}.spinner{display:inline-block;width:12px;height:12px;border:2px solid var(--muted);border-top-color:transparent;border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:420px){body{padding:0;background:var(--page)}.phone{height:calc(100dvh - 55px);min-height:0;border:0;border-radius:0;box-shadow:none}.tools{padding:9px}.wrap{gap:0}.content{padding-left:16px;padding-right:16px}}@media(prefers-reduced-motion:reduce){.spinner{animation:none}}
  </style>
  <style>.sheet-card{max-height:85%;overflow-y:auto}.sheet-card .primary{text-align:center}</style>
</head>
<body>
  <div class="wrap"><div class="tools"><a href="prototype-v2.html">← App 原型</a><span>健身模板 · 模拟交互，不调用 AI</span><button id="theme">深浅主题</button><button id="reset">重置演示</button></div>
  <div class="phone"><div class="status"><span>9:41</span><span>●●● Wi-Fi ▰</span></div><header class="top"><div class="brand"><span class="logo" aria-hidden="true"></span><div><h3 id="title">健身</h3><small>项目 · 我的训练</small></div></div><button class="icon" id="menu" aria-label="模板菜单"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button></header><main class="content" id="content"></main><div id="footer"></div><nav class="tabs" id="tabs" aria-label="模板页面"></nav><div id="overlay"></div></div></div>
  <script>
    const KEY='mutcube-fitness-prototype-v1', $=id=>document.getElementById(id);
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const today=new Date(), dateKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`, TODAY=dateKey(today);
    const actions=[{name:'上斜哑铃卧推',weight:12.5,sets:3,reps:'10–12',rir:'2'},{name:'平板哑铃卧推',weight:15,sets:3,reps:'10–12',rir:'1–2'},{name:'蝴蝶机夹胸',weight:30,sets:2,reps:'12–15',rir:'1–2'},{name:'绳索下压',weight:25,sets:3,reps:'12–15',rir:'1–2'}];
    const basePlan=()=>({id:crypto.randomUUID(),name:'胸和三头',actions:structuredClone(actions),version:1});
    let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch{}state??={profile:null,plan:null,draft:null,logs:[],pending:null,events:[]};
    let page=state.profile?'train':'profile', editing=false, busy=false, failed=false, selectedDate=TODAY, month=new Date(today.getFullYear(),today.getMonth(),1), discussion=[], proposal=null;
    function persist(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{$('footer').insertAdjacentHTML('afterbegin','<p class="error">浏览器无法保存草稿，请勿关闭页面。</p>')}}
    function icon(name){const paths={train:'M4 8v8M7 6v12M17 6v12M20 8v8M7 12h10',calendar:'M4 5h16v15H4zM8 3v4M16 3v4M4 10h16',mine:'M5 21v-3a7 7 0 0 1 14 0v3M12 3a4 4 0 1 0 0 8 4 4 0 0 0 0-8'};return `<svg viewBox="0 0 24 24"><path d="${paths[name]}"/></svg>`}
    function draft(){if(!state.draft&&state.plan){state.draft={date:TODAY,note:'',planId:state.plan.id,actions:state.plan.actions.map(a=>({...a,actual:Array.from({length:a.sets},()=>({weight:a.weight,reps:'',rir:''}))}))};persist()}return state.draft}
    function render(){
      $('title').textContent=page==='chat'?'讨论训练计划':page==='profile'?'基本信息':'健身';$('content').innerHTML='';$('footer').innerHTML='';$('tabs').innerHTML='';
      if(page==='profile')profilePage();if(page==='train')trainingPage();if(page==='calendar')calendarPage();if(page==='mine')minePage();if(page==='chat')chatPage();
      if(state.profile&&page!=='profile'&&page!=='chat')$('tabs').innerHTML=[['train','训练'],['calendar','日历'],['mine','我的']].map(([id,text])=>`<button data-page="${id}" class="${page===id?'active':''}">${icon(id)}${text}</button>`).join('');
      $('content').scrollTop=0;
    }
    function profilePage(){const p=state.profile||{};$('content').innerHTML=`<div class="stack"><div class="hero"><h1>${editing?'编辑训练偏好':'从了解你开始'}</h1><p class="muted">建立适合自己的训练节奏。熟悉动作的工作重量可以稍后补充。</p></div><form id="profile-form" class="fields"><div class="card fields"><div class="grid"><label>身高 · cm<input name="height" type="number" min="80" max="250" step="0.1" value="${esc(p.height)}" required></label><label>体重 · kg<input name="weight" type="number" min="20" max="350" step="0.1" value="${esc(p.weight)}" required></label></div><label>训练目标<select name="goal"><option>增肌</option><option>减脂与保持肌肉</option><option>力量提升</option><option>保持健康</option></select></label><div class="grid"><label>每周训练次数<select name="frequency"><option>3 次</option><option>4 次</option><option>5 次</option><option>6 次</option><option>2 次</option></select></label><label>训练分化<select name="split"><option>三分化</option><option>二分化</option><option>四分化</option><option>全身训练</option><option>由 AI 建议</option></select></label></div><label>训练经验 · 选填<select name="experience"><option>暂不填写</option><option>刚开始训练</option><option>已有稳定训练习惯</option></select></label><label>器械条件 · 选填<input name="equipment" placeholder="例如：健身房、哑铃" value="${esc(p.equipment)}"></label><label>动作限制 · 选填<textarea name="limits" placeholder="例如：腿部暂不增加负荷">${esc(p.limits)}</textarea></label></div><div class="card fields"><h3>熟悉动作的工作重量 <small>选填</small></h3><p class="muted"><small>不是极限重量。不熟悉的动作留空即可；哑铃重量按单只填写。</small></p>${['哑铃卧推','高位下拉','哑铃推肩','高脚杯深蹲'].map((n,i)=>`<label>${n} · kg<input name="lift${i}" type="number" min="0" step="0.5" placeholder="可留空" value="${esc(p['lift'+i])}"></label>`).join('')}</div><p class="muted"><small>此原型不会依据这些信息计算处方，后续计划由模板与 AI 能力生成。</small></p></form></div>`;
      for(const n of ['goal','frequency','split','experience'])if(p[n])$('profile-form').elements[n].value=p[n];
      $('footer').innerHTML=`<div class="footer"><button class="primary" type="submit" form="profile-form">${editing?'保存基本信息':'保存并开始'}</button>${editing?'<button data-page="mine">取消</button>':''}</div>`;
      $('profile-form').onsubmit=e=>{e.preventDefault();state.profile=Object.fromEntries(new FormData(e.target));persist();page=editing?'mine':'train';editing=false;render()};
    }
    function trainingPage(){
      const log=state.logs.find(l=>l.date===TODAY);let html=`<div class="stack"><div class="hero"><small>${today.getMonth()+1} 月 ${today.getDate()} 日 · 今日</small><div class="row"><h1>${state.plan?.name||'开始你的训练'}</h1><span class="tag">${log?'今日已记录':state.plan?'计划 v'+state.plan.version:'尚无计划'}</span></div><p class="muted">${log?'记录已保存，可在日历中回顾。':'目标是参考，实际重量与组数都可以修改。'}</p></div>`;
      if(state.pending)html+=`<div class="card stack"><div class="row"><h3>${state.pending.kind==='adjust'?'调整计划待确认':'下一次计划待确认'}</h3><span class="tag">未生效</span></div><p>${esc(state.pending.plan.name)} · ${state.pending.plan.actions.length} 个动作</p><button id="preview" class="outline">查看并确认计划</button></div>`;
      if(busy)html+='<div class="notice" role="status"><span class="spinner"></span> 正在生成计划…训练记录不受影响。</div>';
      if(failed)html+='<div class="notice"><p class="error">训练记录已保存，计划生成失败。</p><button id="retry">重试生成计划</button></div>';
      if(!state.plan&&!log)html+='<div class="card empty"><h2>还没有训练计划</h2><p class="muted">基本信息已保存。生成后先预览，再确认使用。</p><button id="initial" class="primary">生成首份计划</button></div>';
      if(state.plan&&!log){const d=draft();html+=d.actions.map((a,i)=>`<article class="card"><div class="row"><h3>${esc(a.name)}</h3><span class="tag">${a.sets} 组</span></div><p class="muted"><small>目标 ${a.weight} kg · 每组 ${a.reps} 次 · RIR ${a.rir}</small></p><div class="sets"><div class="set set-head"><span>组</span><span>重量/kg</span><span>实际次数</span><span>实际 RIR</span><span></span></div><div id="sets-${i}">${setRows(a,i)}</div></div><button data-add="${i}" class="outline" style="margin-top:12px;padding:8px 12px">＋ 增加一组</button></article>`).join('');html+=`<label>训练备注 · 选填<textarea id="note" placeholder="记录感受或动作情况">${esc(d.note)}</textarea></label><small id="draft-status" role="status">草稿已自动保存</small><p id="validation" class="error" role="alert"></p>`;$('footer').innerHTML='<div class="footer"><button class="primary" id="submit">提交训练记录</button><small>先保存记录，再生成下一次计划</small></div>'}
      if(log)html+=`<div class="card stack"><h3>今天的训练已完成</h3><p class="muted">${log.actions.length} 个动作 · ${log.actions.reduce((n,a)=>n+a.actual.length,0)} 组</p><button id="today-log">查看实际记录</button></div>${!busy&&!state.pending&&!failed?'<button id="next" class="outline">生成下一次计划</button>':''}`;
      html+='</div>';$('content').innerHTML=html;
      if($('initial'))$('initial').onclick=()=>generate(true);if($('next'))$('next').onclick=()=>generate(false);if($('retry'))$('retry').onclick=()=>generate(false);if($('preview'))$('preview').onclick=preview;
      if($('today-log'))$('today-log').onclick=()=>{selectedDate=TODAY;page='calendar';render()};if($('note'))$('note').oninput=e=>{state.draft.note=e.target.value;persist()};if($('submit'))$('submit').onclick=submit;
    }
    function setRows(a,i){return a.actual.map((s,j)=>`<div class="set" style="margin-bottom:8px"><small>${j+1}</small>${['weight','reps','rir'].map(k=>`<input aria-label="${esc(a.name)}第${j+1}组${{weight:'重量',reps:'次数',rir:'RIR'}[k]}" type="number" min="0" max="${k==='rir'?10:k==='reps'?200:500}" step="${k==='weight'?0.5:1}" value="${esc(s[k])}" data-field="${i}:${j}:${k}" placeholder="—">`).join('')}<button data-remove="${i}:${j}" aria-label="删除第${j+1}组" ${a.actual.length===1?'disabled':''}>×</button></div>`).join('')}
    function submit(){const d=state.draft;const valid=d.actions.every(a=>a.actual.every(s=>s.weight!==''&&Number(s.weight)>=0&&Number(s.weight)<=500&&s.reps!==''&&Number.isInteger(Number(s.reps))&&Number(s.reps)>0&&Number(s.reps)<=200&&s.rir!==''&&Number.isInteger(Number(s.rir))&&Number(s.rir)>=0&&Number(s.rir)<=10));if(!valid){$('validation').textContent='请填写每组实际次数和 RIR，并检查重量。RIR 范围为 0–10。';$('validation').scrollIntoView({block:'nearest'});return}if(state.logs.some(l=>l.date===TODAY))return;state.logs.push({...structuredClone(d),date:TODAY,id:crypto.randomUUID()});state.draft=null;state.events.push('训练记录已保存');persist();generate(false)}
    async function generate(first){if(busy)return;busy=true;failed=false;render();await new Promise(r=>setTimeout(r,1300));busy=false;if(!first&&sessionStorage.getItem('fitness-demo-fail')==='1'){sessionStorage.removeItem('fitness-demo-fail');failed=true;state.events.push('计划生成失败，训练记录保留');persist();render();return}const plan=basePlan();plan.version=(state.plan?.version||0)+1;if(!first){plan.name='背和二头';plan.actions=[{name:'高位下拉',weight:45,sets:3,reps:'10–12',rir:'2'},{name:'坐姿划船',weight:40,sets:3,reps:'10–12',rir:'2'},{name:'上斜哑铃弯举',weight:5,sets:3,reps:'12–15',rir:'2'}]}state.pending={kind:first?'initial':'next',plan};state.events.push('计划生成完成，等待用户确认');persist();render();preview()}
    function preview(){const p=state.pending;if(!p)return;$('overlay').innerHTML=`<div class="sheet"><section class="sheet-card" role="dialog" aria-modal="true" aria-label="确认训练计划"><div class="row"><h2>${esc(p.plan.name)}</h2><button id="close-sheet" class="icon" aria-label="关闭">×</button></div><p class="muted">这是模拟计划。确认前不会替换当前计划。</p>${p.plan.actions.map(a=>`<p>${esc(a.name)}<br><small>${a.weight} kg · ${a.sets} 组 × ${a.reps} 次 · RIR ${a.rir}</small></p>`).join('')}<button class="primary" id="confirm-plan">确认使用${p.kind==='next'?'，作为下一次计划':''}</button><button id="later">稍后再决定</button></section></div>`;$('close-sheet').onclick=$('later').onclick=closeSheet;$('confirm-plan').onclick=()=>{state.plan=state.pending.plan;state.pending=null;state.draft=null;state.events.push('用户确认计划，新版本生效');persist();closeSheet();page='train';render()}}
    function closeSheet(){$('overlay').innerHTML=''}
    function calendarPage(){const year=month.getFullYear(),m=month.getMonth(),count=new Date(year,m+1,0).getDate(),offset=(month.getDay()+6)%7;const log=state.logs.find(l=>l.date===selectedDate);$('content').innerHTML=`<div class="stack"><div class="hero"><h1>每一次训练，都有迹可循</h1><p class="muted">有底色的日期代表已保存训练记录。</p></div><div class="card stack"><div class="row"><button id="prev-month" aria-label="上个月">‹</button><h3>${year} 年 ${m+1} 月</h3><button id="next-month" aria-label="下个月">›</button></div><div class="calendar">${['一','二','三','四','五','六','日'].map(d=>`<small>${d}</small>`).join('')}${'<span></span>'.repeat(offset)}${Array.from({length:count},(_,i)=>{const key=dateKey(new Date(year,m,i+1));return `<button data-date="${key}" class="${state.logs.some(l=>l.date===key)?'logged':''} ${selectedDate===key?'chosen':''}" aria-label="${key}${state.logs.some(l=>l.date===key)?' 已训练':''}">${i+1}</button>`}).join('')}</div></div><div class="card stack"><h3>${selectedDate}</h3>${log?log.actions.map(a=>`<div><h3>${esc(a.name)}</h3><p class="muted"><small>${a.actual.map((s,i)=>`第${i+1}组 ${s.weight} kg × ${s.reps} · RIR ${s.rir}`).join('<br>')}</small></p></div>`).join('')+`<p class="muted">${esc(log.note||'无备注')}</p><small>已提交的历史记录，不由 AI 覆盖。</small>`:'<p class="muted">当天没有已提交的训练记录。草稿不计入日历。</p>'}</div></div>`;$('prev-month').onclick=()=>{month=new Date(year,m-1,1);render()};$('next-month').onclick=()=>{month=new Date(year,m+1,1);render()}}
    function minePage(){const p=state.profile;$('content').innerHTML=`<div class="stack"><div class="hero"><h1>我的训练偏好</h1><p class="muted">偏好改变后，不会静默替换已确认的计划。</p></div><div class="card stack"><div class="row"><h3>基本信息</h3><button id="edit-profile">编辑</button></div><h2>${esc(p.height)} cm · ${esc(p.weight)} kg</h2><p class="muted">${esc(p.goal)} · ${esc(p.frequency)} · ${esc(p.split)}</p><small>${esc(p.limits||'未设置动作限制')}</small></div><button id="discuss" class="outline">讨论或调整当前计划</button><div class="card stack"><h3>模型交互记录</h3><small>仅展示原型流程状态，不是实际 AI 对话。</small>${state.events.length?state.events.slice().reverse().map(e=>`<p class="muted">${esc(e)}</p>`).join(''):'<p class="muted">暂无交互记录</p>'}</div></div>`;$('edit-profile').onclick=()=>{editing=true;page='profile';render()};$('discuss').onclick=openChat}
    function openChat(){closeSheet();page='chat';render()}
    function chatPage(){$('content').innerHTML=`<div class="stack"><button id="back-template" class="outline">← 返回训练模板</button><div class="notice">模拟同项目正常聊天。仅读取当前计划；修改需生成提案并确认。</div><div class="bubble">${state.plan?`当前计划：${esc(state.plan.name)}（v${state.plan.version}）。想调整什么？`:'还没有已确认的计划，请先在模板中生成。'}</div>${discussion.map(t=>`<div class="bubble ${t.role==='user'?'user':''}">${esc(t.text)}</div>`).join('')}${proposal?'<div class="card stack"><h3>调整提案 · 尚未保存</h3><p>演示：保留当前训练部位，所有动作目标 RIR 调整为 3，避免接近力竭。</p><small>实际产品需要依据用户要求生成；此处不是真实模型建议。</small><button id="review-adjust" class="primary">查看并确认调整</button></div>':''}</div>`;$('footer').innerHTML='<div class="footer"><form id="chat-form" class="composer"><input id="chat-input" aria-label="计划调整需求" placeholder="说说希望如何调整" required><button class="primary" aria-label="发送">↑</button></form></div>';$('back-template').onclick=()=>{page='train';render()};$('chat-form').onsubmit=e=>{e.preventDefault();const text=$('chat-input').value.trim();if(!text)return;discussion.push({role:'user',text});if(state.plan){proposal=structuredClone(state.plan);proposal.id=crypto.randomUUID();proposal.version++;proposal.actions.forEach(a=>a.rir='3');discussion.push({role:'ai',text:'已生成模拟调整提案。确认后才会保存新版本；训练历史不会改变。'})}else discussion.push({role:'ai',text:'请先生成并确认首份计划。'});render()};if($('review-adjust'))$('review-adjust').onclick=()=>{state.pending={kind:'adjust',plan:proposal};persist();preview()}}
    $('content').addEventListener('input',e=>{const field=e.target.dataset.field;if(field){const [i,j,k]=field.split(':');state.draft.actions[i].actual[j][k]=e.target.value;persist()}});
    document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page){page=b.dataset.page;render()}if(b.dataset.date){selectedDate=b.dataset.date;render()}if(b.dataset.add){const i=Number(b.dataset.add),a=state.draft.actions[i];if(a.actual.length>=12)return;a.actual.push({weight:a.weight,reps:'',rir:''});persist();$('sets-'+i).innerHTML=setRows(a,i)}if(b.dataset.remove){const [i,j]=b.dataset.remove.split(':').map(Number),a=state.draft.actions[i];if(a.actual.length>1)a.actual.splice(j,1);persist();$('sets-'+i).innerHTML=setRows(a,i)}});
    $('theme').onclick=()=>document.documentElement.classList.toggle('dark');$('reset').onclick=()=>{if(!confirm('仅清除这个健身原型的演示数据，继续吗？'))return;localStorage.removeItem(KEY);sessionStorage.removeItem('fitness-demo-fail');location.reload()};
    $('menu').onclick=()=>{$('overlay').innerHTML='<div class="sheet"><section class="sheet-card" role="dialog" aria-modal="true" aria-label="模板菜单"><h2>健身模板</h2><button id="menu-chat">讨论或调整计划</button><button id="demo-failure">演示下一次计划生成失败</button><p class="muted"><small>演示失败只影响下一次提交后的生成，不影响记录保存。重试恢复成功。</small></p><button id="menu-close">关闭</button></section></div>';$('menu-close').onclick=closeSheet;$('menu-chat').onclick=openChat;$('demo-failure').onclick=()=>{sessionStorage.setItem('fitness-demo-fail','1');closeSheet()}};
    document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('overlay').innerHTML)closeSheet()});render();
  </script>
</body>
</html>
