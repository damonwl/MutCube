<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MutCube 完整交互原型</title>
  <style>
    :root {
      color-scheme: light;
      --page: #f7f7f5;
      --surface: #fff;
      --soft: #efefec;
      --soft-2: #e8e8e4;
      --ink: #171715;
      --muted: #777772;
      --line: #e3e3de;
      --accent: #171715;
      --accent-ink: #fff;
      --danger: #c7463a;
      --success: #2e7d57;
      --template: #6659c7;
      font-family: "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 20px 12px 28px;
      color: var(--ink);
      background: #ecece9;
    }
    button, textarea, input { font: inherit; color: inherit; }
    button { cursor: pointer; }
    [hidden] { display: none !important; }

    .prototype {
      display: grid;
      justify-items: center;
      gap: 14px;
    }
    .phone {
      position: relative;
      width: min(390px, 100%);
      height: min(844px, calc(100vh - 92px));
      min-height: 680px;
      overflow: hidden;
      border: 1px solid rgba(0,0,0,.08);
      border-radius: 38px;
      background: var(--page);
      box-shadow: 0 24px 70px rgba(20,20,20,.13);
      isolation: isolate;
    }

    .statusbar {
      position: absolute;
      z-index: 12;
      inset: 0 0 auto;
      display: flex;
      height: 38px;
      align-items: center;
      justify-content: space-between;
      padding: 9px 24px 0;
      font-size: 12px;
      font-weight: 600;
      pointer-events: none;
    }
    .status-icons { letter-spacing: 2px; }
    .topbar {
      position: absolute;
      z-index: 5;
      inset: 38px 0 auto;
      display: grid;
      grid-template-columns: 44px 1fr 44px;
      align-items: center;
      gap: 18px;
      padding: 10px 16px 12px;
      background: color-mix(in srgb, var(--page) 92%, transparent);
      backdrop-filter: blur(18px);
    }
    .icon-button {
      display: inline-grid;
      width: 40px;
      height: 40px;
      place-items: center;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: var(--surface);
    }
    .icon-button:hover, .icon-button:focus-visible { background: var(--soft-2); }
    .icon { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.8; }
    .switch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      max-width: 220px;
      width: 100%;
      justify-self: center;
      padding: 3px;
      border-radius: 23px;
      background: var(--soft);
    }
    .switch button {
      min-height: 38px;
      border: 0;
      border-radius: 20px;
      background: transparent;
      color: var(--muted);
      transition: background 180ms ease, color 180ms ease, transform 180ms ease;
    }
    .switch button.active { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.05); }

    .stage {
      height: 100%;
      padding: 112px 18px 96px;
      overflow: hidden;
    }
    .empty {
      display: grid;
      height: 100%;
      place-content: center;
      justify-items: center;
      padding-bottom: 82px;
      color: var(--muted);
      text-align: center;
    }
    .cube-mark {
      position: relative;
      width: 42px;
      height: 42px;
      margin-bottom: 16px;
      transform: rotate(30deg) skew(-4deg, -4deg);
      border: 1.5px solid color-mix(in srgb, var(--ink) 28%, transparent);
      border-radius: 12px;
    }
    .cube-mark::after {
      position: absolute;
      inset: 9px;
      border: 1.5px solid color-mix(in srgb, var(--ink) 18%, transparent);
      border-radius: 7px;
      content: "";
    }
    .empty h1 { margin: 0; color: var(--ink); font-size: 19px; font-weight: 600; }
    .empty p { margin: 7px 0 0; font-size: 13px; }

    .messages {
      display: flex;
      height: 100%;
      flex-direction: column;
      gap: 18px;
      overflow-y: auto;
      padding: 8px 4px 24px;
      scrollbar-width: none;
    }
    .messages::-webkit-scrollbar { display: none; }
    .user-message {
      align-self: flex-end;
      max-width: 83%;
      padding: 11px 15px;
      border-radius: 19px 19px 6px 19px;
      background: var(--accent);
      color: var(--accent-ink);
      line-height: 1.55;
    }
    .assistant-message { align-self: stretch; line-height: 1.66; }
    .assistant-message p { margin: 0 0 10px; }
    .assistant-message strong { font-weight: 650; }
    .cursor { display: inline-block; width: 2px; height: 1em; margin-left: 2px; background: var(--ink); vertical-align: -2px; animation: blink 1s infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .message-actions { display: flex; align-items: center; gap: 3px; margin-top: 4px; color: var(--muted); }
    .message-actions button { display: grid; width: 34px; height: 34px; place-items: center; border: 0; border-radius: 50%; background: transparent; color: inherit; }
    .message-actions button:hover { background: var(--soft); color: var(--ink); }
    .token-line { margin-top: 1px; color: #a1a19d; font-size: 11px; }
    .error-card {
      padding: 14px;
      border: 1px solid color-mix(in srgb, var(--danger) 24%, var(--line));
      border-radius: 18px;
      background: color-mix(in srgb, var(--danger) 6%, var(--surface));
    }
    .error-title { display: flex; align-items: center; gap: 8px; color: var(--danger); font-weight: 650; }
    .error-card p { margin: 7px 0 12px; color: var(--muted); font-size: 13px; }
    .error-actions { display: flex; gap: 8px; }
    .message-failure-row { display: flex; align-self: flex-end; margin-top: -13px; padding-right: 2px; }
    .message-failure { display: grid; width: 28px; height: 28px; place-items: center; border: 0; border-radius: 50%; background: color-mix(in srgb, var(--danger) 12%, var(--surface)); color: var(--danger); }
    .message-failure .icon { width: 18px; height: 18px; }
    .failure-notice { position: absolute; z-index: 26; inset: auto 20px 92px; }
    .failure-notice .error-card { border-radius: 22px; background: var(--surface); box-shadow: 0 18px 46px rgba(0,0,0,.24); }
    .failure-notice-head { display: flex; align-items: center; justify-content: space-between; }
    .failure-notice-head .icon-button { width: 32px; height: 32px; }
    .small-button { min-height: 36px; padding: 0 13px; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); font-size: 13px; }
    .small-button.primary { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }

    .composer-zone { position: absolute; z-index: 6; inset: auto 14px 17px; }
    .composer {
      display: grid;
      grid-template-columns: minmax(0,1fr) auto;
      align-items: center;
      min-height: 58px;
      padding: 7px 8px 7px 14px;
      border: 1px solid var(--line);
      border-radius: 29px;
      background: color-mix(in srgb, var(--surface) 96%, transparent);
      box-shadow: 0 8px 24px rgba(20,20,20,.09);
      backdrop-filter: blur(20px);
      transition: min-height 180ms ease, border-radius 180ms ease, padding 180ms ease;
    }
    .composer.expanded {
      grid-template-columns: 1fr;
      align-items: stretch;
      min-height: 126px;
      padding: 12px 10px 9px 14px;
      border-radius: 25px;
    }
    .message-input {
      width: 100%;
      min-height: 38px;
      max-height: 94px;
      resize: none;
      padding: 8px 4px;
      border: 0;
      outline: 0;
      background: transparent;
      line-height: 1.45;
    }
    .message-input::placeholder { color: #8b8b86; }
    .composer-footer { display: contents; }
    .composer.expanded .composer-footer { display: flex; align-items: center; justify-content: space-between; }
    .model-strength { display: none; align-items: center; gap: 5px; min-height: 38px; padding: 0 8px; border: 0; border-radius: 19px; background: transparent; font-size: 13px; }
    .composer.expanded .model-strength { display: inline-flex; }
    .composer-actions { display: flex; align-items: center; gap: 3px; }
    .composer-actions .icon-button { width: 38px; height: 38px; background: transparent; }
    .composer:not(.expanded) .camera-button { display: none; }
    .composer-actions .send-button { background: var(--accent); color: var(--accent-ink); }
    .composer-actions .send-button:disabled { background: var(--soft); color: #aaa9a5; }

    .template-home { height: 100%; overflow-y: auto; padding: 8px 2px 24px; }
    .template-search { display: grid; grid-template-columns: 20px 1fr 34px; align-items: center; gap: 7px; margin-bottom: 18px; padding: 5px 7px 5px 13px; border: 1px solid var(--line); border-radius: 23px; background: var(--surface); }
    .template-search input, .settings-search input, .drawer-search input { min-width: 0; border: 0; outline: 0; background: transparent; }
    .template-heading h1 { margin: 0; font-size: 24px; }
    .template-heading p { margin: 5px 0 22px; color: var(--muted); font-size: 13px; }
    .template-card { display: grid; grid-template-columns: 50px 1fr 20px; align-items: center; gap: 13px; width: 100%; min-height: 82px; margin-bottom: 10px; padding: 13px; border: 1px solid transparent; border-radius: 21px; background: var(--surface); text-align: left; }
    .template-card:hover { border-color: var(--line); transform: translateY(-1px); }
    .template-icon { display: grid; width: 50px; height: 50px; place-items: center; border-radius: 16px; background: #eeebff; color: var(--template); }
    .template-card strong, .template-card small { display: block; }
    .template-card small { margin-top: 4px; color: var(--muted); }

    .scrim { position: absolute; z-index: 20; inset: 0; background: rgba(0,0,0,.38); opacity: 1; transition: opacity 180ms ease; }
    .drawer {
      position: absolute;
      z-index: 21;
      inset: 0 48px 0 0;
      display: flex;
      flex-direction: column;
      padding: 50px 16px 16px;
      border-radius: 38px 22px 22px 38px;
      background: var(--surface);
      box-shadow: 15px 0 50px rgba(0,0,0,.18);
      animation: drawer-in 190ms ease-out;
    }
    @keyframes drawer-in { from { transform: translateX(-26px); opacity: .6; } }
    .drawer-brand { display: flex; min-height: 44px; align-items: center; justify-content: space-between; padding: 0 4px; }
    .wordmark { display: flex; align-items: center; gap: 9px; font-size: 21px; font-weight: 720; letter-spacing: -.4px; }
    .mini-cube { width: 23px; height: 23px; transform: rotate(30deg); border: 1.5px solid currentColor; border-radius: 7px; }
    .wordmark .cube-mark { width: 25px; height: 25px; margin: 0; border-radius: 8px; }
    .wordmark .cube-mark::after { inset: 5px; border-radius: 4px; }
    .drawer-search { display: grid; grid-template-columns: 20px 1fr 30px; align-items: center; gap: 7px; margin-top: 8px; padding: 5px 7px 5px 12px; border-radius: 20px; background: var(--soft); }
    .profile {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 12px;
      padding: 10px 11px;
      border-radius: 18px;
      background: var(--soft);
    }
    .avatar { display: grid; width: 40px; height: 40px; flex: 0 0 auto; place-items: center; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-weight: 650; }
    .profile-copy { min-width: 0; flex: 1; }
    .profile-copy strong, .profile-copy small { display: block; }
    .profile-copy small { margin-top: 2px; color: var(--muted); font-size: 11px; }
    .profile-actions { display: flex; gap: 2px; }
    .profile-actions .icon-button { width: 36px; height: 36px; background: transparent; color: var(--muted); }
    .all-chats { display: flex; width: 100%; min-height: 43px; align-items: center; gap: 10px; margin-top: 12px; padding: 0 10px; border: 0; border-radius: 13px; background: var(--soft); text-align: left; font-weight: 600; }
    .drawer-scroll { min-height: 0; flex: 1; overflow-y: auto; padding-top: 2px; scrollbar-width: none; }
    .drawer-section { margin-top: 13px; }
    .drawer-section h2 { margin: 0 0 5px; padding: 0 8px; color: var(--muted); font-size: 12px; font-weight: 600; }
    .drawer-row { display: grid; grid-template-columns: 19px minmax(0,1fr) auto; align-items: center; gap: 9px; width: 100%; min-height: 39px; padding: 6px 9px; border: 0; border-radius: 11px; background: transparent; text-align: left; }
    .drawer-row:hover { background: var(--soft); }
    .drawer-row span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .drawer-row small { color: var(--muted); font-size: 10px; }
    .new-chat { display: flex; width: 100%; min-height: 48px; flex: 0 0 auto; align-items: center; justify-content: center; gap: 8px; margin-top: 10px; border: 0; border-radius: 24px; background: var(--accent); color: var(--accent-ink); font-weight: 650; }

    .sheet { position: absolute; z-index: 22; inset: auto 0 0; padding: 9px 14px 20px; border-radius: 28px 28px 0 0; background: var(--surface); box-shadow: 0 -20px 55px rgba(0,0,0,.2); animation: sheet-in 180ms ease-out; }
    @keyframes sheet-in { from { transform: translateY(24px); opacity: .7; } }
    .sheet-handle { width: 38px; height: 4px; margin: 0 auto 15px; border-radius: 4px; background: var(--line); }
    .attachment-actions { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; }
    .attachment-actions button { display: grid; min-height: 86px; place-items: center; gap: 5px; padding: 10px 3px; border: 0; border-radius: 17px; background: var(--soft); font-size: 12px; }
    .attachment-actions .icon-disc { display: grid; width: 39px; height: 39px; place-items: center; border-radius: 50%; background: var(--surface); }
    .gallery { display: grid; grid-template-columns: repeat(3,1fr); gap: 3px; margin-top: 12px; }
    .photo { position: relative; aspect-ratio: 1.12; overflow: hidden; border: 0; background: linear-gradient(145deg,#b7c6aa,#667863); }
    .photo::before { position: absolute; inset: 18% 8% -20% 25%; border-radius: 50% 50% 0 0; background: rgba(255,255,255,.32); content: ""; transform: rotate(-10deg); }
    .photo:nth-child(2) { background: linear-gradient(145deg,#a6bfd3,#4d6a82); }
    .photo:nth-child(3) { background: linear-gradient(145deg,#d2b4a1,#785c50); }
    .photo:nth-child(4) { background: linear-gradient(145deg,#d8ca94,#8a7737); }
    .photo:nth-child(5) { background: linear-gradient(145deg,#b8a5cf,#65527c); }
    .photo:nth-child(6) { background: linear-gradient(145deg,#a8cfca,#4f7772); }

    .strength-options { display: grid; gap: 4px; }
    .strength-options button { display: grid; grid-template-columns: 32px 1fr 22px; align-items: center; gap: 10px; width: 100%; min-height: 56px; padding: 7px 10px; border: 0; border-radius: 14px; background: transparent; text-align: left; }
    .strength-options button:hover, .strength-options button.selected { background: var(--soft); }
    .strength-options strong, .strength-options small { display: block; }
    .strength-options small { margin-top: 2px; color: var(--muted); font-size: 11px; }

    .settings-page { position: absolute; z-index: 10; inset: 0; overflow-y: auto; padding: 48px 16px 26px; background: var(--page); }
    .settings-header { display: grid; grid-template-columns: 40px 1fr 40px; align-items: center; margin-bottom: 10px; }
    .settings-header h1 { margin: 0; font-size: 25px; }
    .settings-search { display: grid; grid-template-columns: 20px 1fr; align-items: center; gap: 8px; min-height: 45px; margin: 8px 2px 18px; padding: 0 13px; border-radius: 23px; background: var(--soft); }
    .settings-group { margin-top: 17px; }
    .settings-group h2 { margin: 0 0 7px; padding: 0 8px; color: var(--muted); font-size: 12px; font-weight: 650; }
    .settings-card { overflow: hidden; border: 1px solid var(--line); border-radius: 20px; background: var(--surface); }
    .settings-row { display: grid; grid-template-columns: 38px minmax(0,1fr) auto 18px; align-items: center; gap: 8px; width: 100%; min-height: 68px; padding: 9px 13px; border: 0; border-bottom: 1px solid var(--line); background: transparent; text-align: left; }
    .settings-row:last-child { border-bottom: 0; }
    .settings-row:hover { background: var(--soft); }
    .settings-icon { display: grid; width: 34px; height: 34px; place-items: center; border-radius: 11px; background: var(--soft); }
    .settings-copy { min-width: 0; }
    .settings-copy strong, .settings-copy small { display: block; }
    .settings-copy strong { font-size: 14px; }
    .settings-copy small { overflow: hidden; margin-top: 3px; color: var(--muted); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
    .settings-value { color: var(--muted); font-size: 11px; }
    .settings-empty { padding: 40px 20px; color: var(--muted); text-align: center; }

    .app-page { position: absolute; z-index: 14; inset: 0; overflow-y: auto; padding: 48px 16px 28px; background: var(--page); }
    .page-header { position: sticky; z-index: 2; top: -48px; display: grid; grid-template-columns: 40px minmax(0,1fr) 40px; align-items: center; min-height: 62px; margin: -1px 0 10px; background: color-mix(in srgb, var(--page) 94%, transparent); backdrop-filter: blur(18px); }
    .page-header h1 { overflow: hidden; margin: 0; font-size: 21px; text-overflow: ellipsis; white-space: nowrap; }
    .page-content { display: grid; gap: 16px; padding-bottom: 18px; }
    .page-intro { margin: -2px 5px 2px; color: var(--muted); font-size: 12px; line-height: 1.55; }
    .section-title { margin: 2px 7px -9px; color: var(--muted); font-size: 12px; font-weight: 650; }
    .hero-card, .form-card, .list-card { overflow: hidden; border: 1px solid var(--line); border-radius: 20px; background: var(--surface); }
    .hero-card { padding: 17px; }
    .hero-card h2 { margin: 0; font-size: 18px; }
    .hero-card p { margin: 6px 0 0; color: var(--muted); font-size: 12px; line-height: 1.55; }
    .hero-row { display: flex; align-items: center; gap: 12px; }
    .hero-icon { display: grid; width: 46px; height: 46px; flex: 0 0 auto; place-items: center; border-radius: 15px; background: var(--soft); }
    .status-badge { display: inline-flex; min-height: 25px; align-items: center; gap: 5px; margin-top: 10px; padding: 0 9px; border-radius: 13px; background: color-mix(in srgb, var(--success) 12%, var(--surface)); color: var(--success); font-size: 11px; }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .form-row, .list-row { display: grid; grid-template-columns: minmax(0,1fr) auto; align-items: center; gap: 10px; min-height: 58px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
    .form-row:last-child, .list-row:last-child { border-bottom: 0; }
    button.list-row { width: 100%; border: 0; background: transparent; text-align: left; }
    button.list-row:hover { background: var(--soft); }
    .row-copy strong, .row-copy small { display: block; }
    .row-copy strong { font-size: 13px; font-weight: 590; }
    .row-copy small { margin-top: 3px; color: var(--muted); font-size: 11px; line-height: 1.35; }
    .row-value { color: var(--muted); font-size: 11px; }
    .toggle { position: relative; width: 42px; height: 25px; padding: 0; border: 0; border-radius: 13px; background: var(--soft-2); transition: background 150ms ease; }
    .toggle::after { position: absolute; top: 3px; left: 3px; width: 19px; height: 19px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.18); content: ""; transition: transform 150ms ease; }
    .toggle.on { background: var(--accent); }
    .toggle.on::after { transform: translateX(17px); background: var(--accent-ink); }
    .choice-chips { display: flex; flex-wrap: wrap; gap: 7px; padding: 12px 14px; }
    .chip { min-height: 34px; padding: 0 12px; border: 1px solid var(--line); border-radius: 17px; background: var(--surface); font-size: 12px; }
    .chip.selected { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
    .field { display: grid; gap: 6px; padding: 11px 14px; border-bottom: 1px solid var(--line); }
    .field:last-child { border-bottom: 0; }
    .field label { color: var(--muted); font-size: 11px; }
    .text-field, .textarea-field { width: 100%; border: 0; outline: 0; background: transparent; }
    .textarea-field { min-height: 82px; resize: vertical; line-height: 1.5; }
    .action-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .primary-action, .secondary-action, .danger-action { min-height: 42px; padding: 0 15px; border-radius: 21px; font-size: 12px; font-weight: 600; }
    .primary-action { border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); }
    .secondary-action { border: 1px solid var(--line); background: var(--surface); }
    .danger-action { border: 1px solid color-mix(in srgb, var(--danger) 35%, var(--line)); background: transparent; color: var(--danger); }
    .full-action { width: 100%; }
    .stats-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 8px; }
    .stat-card { padding: 14px; border: 1px solid var(--line); border-radius: 17px; background: var(--surface); }
    .stat-card strong, .stat-card small { display: block; }
    .stat-card strong { font-size: 20px; }
    .stat-card small { margin-top: 3px; color: var(--muted); font-size: 10px; }
    .tabs { display: flex; gap: 3px; padding: 3px; border-radius: 20px; background: var(--soft); overflow-x: auto; }
    .tabs button { min-height: 34px; flex: 1 0 auto; padding: 0 10px; border: 0; border-radius: 17px; background: transparent; color: var(--muted); font-size: 11px; }
    .tabs button.active { background: var(--surface); color: var(--ink); font-weight: 600; }
    .empty-card { padding: 28px 16px; border: 1px dashed var(--line); border-radius: 18px; color: var(--muted); font-size: 12px; line-height: 1.55; text-align: center; }
    .conversation-list .list-row { grid-template-columns: minmax(0,1fr) auto; }
    .conversation-list time { color: var(--muted); font-size: 10px; }
    .translation-box { min-height: 145px; }
    .audit-code { overflow-x: auto; margin: 0; padding: 13px; border-radius: 15px; background: var(--soft); color: var(--muted); font: 10px/1.55 ui-monospace, monospace; white-space: pre-wrap; }
    .toast { position: absolute; z-index: 30; left: 50%; bottom: 26px; max-width: calc(100% - 40px); padding: 10px 15px; border-radius: 19px; background: var(--ink); color: var(--page); font-size: 11px; transform: translateX(-50%); box-shadow: 0 8px 24px rgba(0,0,0,.2); }
    .shortcut-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
    .shortcut-grid button { display: flex; min-height: 42px; align-items: center; gap: 8px; padding: 0 11px; border: 0; border-radius: 14px; background: var(--soft); font-size: 12px; }
    .app-page.project-page { overflow: hidden; }
    .project-page .page-content { height: calc(100% - 72px); align-content: start; overflow-y: auto; padding-bottom: 96px; scrollbar-width: none; }
    .project-page .page-content::-webkit-scrollbar { display: none; }
    .project-composer-shell { position: absolute; z-index: 3; right: 16px; bottom: 17px; left: 16px; padding-top: 20px; background: linear-gradient(transparent, var(--page) 30%); }

    .demo-bar { display: flex; max-width: 100%; flex-wrap: wrap; justify-content: center; gap: 6px; }
    .demo-bar button { min-height: 34px; padding: 0 11px; border: 1px solid rgba(0,0,0,.1); border-radius: 17px; background: #fff; color: #555; font-size: 12px; }
    .demo-bar button.active { border-color: #171715; background: #171715; color: #fff; }
    .caption { margin: 0; color: #74746f; font-size: 12px; text-align: center; }

    @media (prefers-color-scheme: dark) {
      :root { color-scheme: dark; --page:#151515; --surface:#222; --soft:#2c2c2a; --soft-2:#353533; --ink:#f4f4f1; --muted:#aaa9a4; --line:#3a3a37; --accent:#f4f4f1; --accent-ink:#171715; --template:#b9afff; }
      body { background:#0d0d0d; }
      .phone { border-color:rgba(255,255,255,.1); box-shadow:0 24px 70px rgba(0,0,0,.48); }
      .demo-bar button { border-color:rgba(255,255,255,.12); background:#222; color:#bbb; }
      .demo-bar button.active { background:#f4f4f1; color:#171715; }
      .template-icon { background:#302b52; }
    }
    @media (max-width: 420px) {

      .drawer { border-radius: 0 22px 22px 0; }
      .demo-bar { padding: 8px; }
      .caption { padding-bottom: 8px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior:auto!important; animation-duration:.01ms!important; transition-duration:.01ms!important; } }

<body>
<div class="prototype">
  <div class="phone" id="phone">

    <main class="stage">
      <section class="empty" id="emptyView">

        <h1>有什么可以帮你？</h1>
        <p>一种智能，无限形态</p>

          <span class="template-icon"><svg class="icon"><use href="#i-book"/></svg></span>
          <span><strong>深度学习</strong><small>阅读、课程与研究笔记</small></span>

    <section class="composer-zone" id="composerZone">

    <div class="scrim" id="scrim" hidden></div>
    <aside class="drawer" id="drawer" aria-label="侧边栏" hidden>
      <div class="drawer-brand">
        <span class="wordmark"><span class="cube-mark" aria-hidden="true"></span>MutCube</span>
        <button class="icon-button" id="drawerSearchButton" aria-label="搜索"><svg class="icon"><use href="#i-search"/></svg></button>

      <div class="drawer-scroll">
        <section class="drawer-section">
          <h2>置顶</h2>
          <button class="drawer-row" data-open-page="project-training"><svg class="icon"><use href="#i-folder"/></svg><span>渐进训练</span><small>项目</small></button>
          <button class="drawer-row" data-demo-link="conversation"><svg class="icon"><use href="#i-message"/></svg><span>每周计划整理</span><small>聊天</small></button>
        </section>
        <section class="drawer-section">
          <h2>项目</h2>
          <button class="drawer-row" data-open-page="project-training"><svg class="icon"><use href="#i-folder"/></svg><span>渐进训练</span><small></small></button>
          <button class="drawer-row" data-open-page="project-study"><svg class="icon"><use href="#i-folder"/></svg><span>深度学习</span><small></small></button>
          <button class="drawer-row" data-open-page="project-new"><svg class="icon"><use href="#i-plus"/></svg><span>新建项目</span><small></small></button>
        </section>
        <section class="drawer-section">

          <button class="drawer-row" data-demo-link="conversation"><svg class="icon"><use href="#i-message"/></svg><span>今天肩部不太舒服</span><small>刚刚</small></button>
          <button class="drawer-row" data-demo-link="conversation"><svg class="icon"><use href="#i-message"/></svg><span>训练日的饮食安排</span><small>昨天</small></button>
          <button class="drawer-row" data-demo-link="conversation"><svg class="icon"><use href="#i-message"/></svg><span>把复杂任务拆成一周计划</span><small>周一</small></button>

      </div>
      <button class="new-chat" id="newChatButton"><svg class="icon"><use href="#i-edit"/></svg>新建对话</button>
    </aside>

    <section class="sheet" id="attachmentSheet" hidden>
      <div class="sheet-handle"></div>
      <div class="attachment-actions">
        <button><span class="icon-disc"><svg class="icon"><use href="#i-camera"/></svg></span>拍照</button>
        <button><span class="icon-disc"><svg class="icon"><use href="#i-image"/></svg></span>相册</button>

      <div class="gallery"><button class="photo" aria-label="照片一"></button><button class="photo" aria-label="照片二"></button><button class="photo" aria-label="照片三"></button><button class="photo" aria-label="照片四"></button><button class="photo" aria-label="照片五"></button><button class="photo" aria-label="照片六"></button></div>

        <button data-strength="标准"><svg class="icon"><use href="#i-gauge"/></svg><span><strong>标准</strong><small>平衡速度与思考深度</small></span><span></span></button>
        <button data-strength="深入"><svg class="icon"><use href="#i-brain"/></svg><span><strong>深入</strong><small>适合复杂分析与规划</small></span><span></span></button>
      </div>
    </section>

          <div class="error-title" id="failureNoticeTitle"><svg class="icon"><use href="#i-alert"/></svg>消息生成失败</div>
          <button class="icon-button" data-close-failure aria-label="关闭提醒"><svg class="icon"><use href="#i-close"/></svg></button>
        </div>
        <p>模型服务暂时无法连接。你的消息已经保留，可以重新尝试，或者检查当前 Provider 配置。</p>
        <div class="error-actions"><button class="small-button primary" data-demo-link="streaming">重新尝试</button><button class="small-button" data-demo-link="settings">检查设置</button></div>
      </div>
    </section>

        </div></section>

      </div>
    </section>

    <section class="sheet" id="messageSheet" hidden>
      <div class="sheet-handle"></div>
      <div class="list-card">
        <button class="list-row" data-prototype-action="已收藏这条回答"><span class="row-copy"><strong>收藏回答</strong><small>可从侧边栏收藏入口访问</small></span><svg class="icon"><use href="#i-star"/></svg></button>

        <button class="list-row" data-prototype-action="已从此处派生新对话"><span class="row-copy"><strong>派生新对话</strong><small>保留此前上下文</small></span><svg class="icon"><use href="#i-message"/></svg></button>
        <button class="list-row" data-open-page="generation-detail"><span class="row-copy"><strong>生成详情</strong><small>推理、工具调用和原始统计</small></span><svg class="icon"><use href="#i-chevron"/></svg></button>
        <button class="list-row" data-prototype-action="消息及后续分支已删除"><span class="row-copy"><strong style="color:var(--danger)">删除消息</strong><small>同时删除其后续分支</small></span><svg class="icon"><use href="#i-trash"/></svg></button>
      </div>
    </section>

    <div class="toast" id="toast" hidden></div>
  </div>

  <nav class="demo-bar" aria-label="原型演示状态">

    <button data-demo="settings">设置</button>
    <button data-open-page="feature-map">功能地图</button>
  </nav>
  <p class="caption" id="caption">点击输入框查看展开状态；空白草稿不会进入历史记录。</p>
</div>

  function icon(id) { return `<svg class="icon"><use href="#${id}"/></svg>`; }
  function closeOverlays() { drawer.hidden = true; attachSheet.hidden = true; strengthSheet.hidden = true; failureNotice.hidden = true; conversationSheet.hidden = true; projectSheet.hidden = true; messageSheet.hidden = true; scrim.hidden = true; }
  function showOverlay(element) { closeOverlays(); element.hidden = false; scrim.hidden = false; }
  function showToast(message) {
    const toast = $('#toast');
    clearTimeout(toastTimer);
    toast.textContent = message;
    toast.hidden = false;
    toastTimer = setTimeout(() => { toast.hidden = true; }, 2200);
  }
  function renderPage(key, remember = true) {
    const definition = pages[key];
    if (!definition) return;
    if (definition.project) currentProjectName = definition.title;
    if (remember) {
      if (currentPage) pageHistory.push({ type: 'page', id: currentPage });
      else if (!settingsPage.hidden) pageHistory.push({ type: 'settings' });
      else pageHistory.push({ type: 'surface', id: surface, demo: currentDemo });
    }
    closeOverlays();
    settingsPage.hidden = true;
    $('#mainTopbar').hidden = true;
    composerZone.hidden = true;
    emptyView.hidden = true;
    messagesView.hidden = true;
    templateView.hidden = true;
    appPage.hidden = false;
    appPage.classList.toggle('project-page', Boolean(definition.project));
    appPageTitle.textContent = definition.title;
    appPageContent.innerHTML = `${definition.intro ? `<p class="page-intro">${definition.intro}</p>` : ''}${definition.body()}`;
    appPage.scrollTop = 0;
    currentPage = key;
    caption.textContent = `当前页面：${definition.title}。页面内的按钮、开关和下级入口均可操作。`;
    $$('.demo-bar button').forEach(button => button.classList.toggle('active', button.dataset.openPage === key));
  }
  function restoreSettings() {
    currentPage = null;
    appPage.hidden = true;
    settingsPage.hidden = false;
    $('#mainTopbar').hidden = true;
    composerZone.hidden = true;
    emptyView.hidden = true;
    messagesView.hidden = true;
    templateView.hidden = true;
    caption.textContent = '设置首页：每个功能入口都可以进入完整详情页。';
  }
  function restoreSurface(target) {
    currentPage = null;
    appPage.hidden = true;
    $('#mainTopbar').hidden = false;
    selectSurface(target || 'chat');
  }
  function goBackPage() {
    const previous = pageHistory.pop();
    if (!previous || previous.type === 'surface') { restoreSurface(previous?.id || 'chat'); return; }
    if (previous.type === 'settings') { restoreSettings(); return; }
    renderPage(previous.id, false);
  }
  function setComposer(expanded) { composer.classList.toggle('expanded', expanded); }
  function syncSendButton() {
    const hasText = input.value.trim().length > 0;
    addSend.innerHTML = icon(hasText ? 'i-up' : 'i-plus');
    addSend.setAttribute('aria-label', hasText ? '发送消息' : '添加附件');
  }
  function setDemo(name, preserveNavigation = false) {
    if (name !== 'settings') currentDemo = name;
    currentPage = null;
    if (!preserveNavigation) {
      pageHistory = [];
      conversationReturnPage = null;
      conversationHistoryArmed = false;
    }
    appPage.hidden = true;
    settingsPage.hidden = true;
    closeOverlays();
    surface = 'chat';
    $('#chatTab').classList.add('active');
    $('#templateTab').classList.remove('active');
    emptyView.hidden = name !== 'empty';
    messagesView.hidden = name === 'empty';
    templateView.hidden = true;
    composerZone.hidden = false;
    $('#mainTopbar').hidden = false;
    setComposer(false);
    input.value = '';
    syncSendButton();
    const user = `<div class="user-message">帮我把今天的训练计划调整得轻松一些，肩部有点不舒服。</div>`;
    const actions = `<div class="message-actions"><button aria-label="复制" data-prototype-action="回答已复制">${icon('i-copy')}</button><button aria-label="分享" data-prototype-action="已打开系统分享面板">${icon('i-share')}</button><button aria-label="重新生成" data-prototype-action="已生成新的回答候选版本">${icon('i-refresh')}</button><button aria-label="朗读" data-prototype-action="开始朗读回答">${icon('i-volume')}</button><button aria-label="更多消息操作" data-message-menu>${icon('i-more')}</button></div>`;
    if (name === 'conversation') {
      messagesView.innerHTML = `${user}<div class="assistant-message"><p>可以。今天先避免高负荷推举和任何引起疼痛的动作，把训练调整为<strong>下肢与轻量核心</strong>。</p><p>如果肩部在日常活动中也疼痛，建议暂停上肢训练并观察恢复情况。</p>${actions}<div class="token-line">↑ 1.2K · ↓ 168 tokens · 42.8 tok/s · 3.9s</div></div>`;
      caption.textContent = '消息操作保持稳定；Token 信息弱化显示，可进一步展开详情。';
    } else if (name === 'streaming') {
      messagesView.innerHTML = `${user}<div class="assistant-message"><p>可以。今天先避开高负荷推举，我会把计划调整为下肢训练，并保留轻量核心动作<span class="cursor"></span></p></div>`;
      caption.textContent = '生成时只更新正文，操作栏在完成后出现，避免页面跳动。';
    } else if (name === 'error') {
      messagesView.innerHTML = `${user}<div class="message-failure-row"><button class="message-failure" data-show-failure aria-label="查看生成失败原因">${icon('i-alert')}</button></div>`;
      caption.textContent = '生成失败只显示轻量感叹号；点击后再查看原因和处理选项。';
    } else if (name === 'settings') {
      $('#settingsQuery').value = '';
      $$('[data-group], [data-setting]').forEach(item => { item.hidden = false; });
      $('#settingsEmpty').hidden = true;
      settingsPage.hidden = false;
      $('#mainTopbar').hidden = true;
      composerZone.hidden = true;
      emptyView.hidden = true;
      messagesView.hidden = true;
      caption.textContent = '设置使用独立页面、卡片分组、状态摘要和实时搜索。';
    } else {
      messagesView.innerHTML = '';
      caption.textContent = '点击输入框查看展开状态；空白草稿不会进入历史记录。';
    }
    $$('.demo-bar button').forEach(button => button.classList.toggle('active', button.dataset.demo === name));
  }
  function returnToProject() {
    if (!conversationReturnPage) return false;
    const projectPage = conversationReturnPage;
    conversationReturnPage = null;
    conversationHistoryArmed = false;
    renderPage(projectPage, false);
    caption.textContent = `已返回“${pages[projectPage].title}”，可以继续选择同一项目中的其他会话。`;
    return true;
  }
  function armProjectReturn(projectPage) {
    conversationReturnPage = projectPage;
    window.history.pushState({ mutcubeView: 'project-conversation' }, '');
    conversationHistoryArmed = true;
  }
  window.addEventListener('popstate', () => {
    if (conversationHistoryArmed) returnToProject();
  });
  function selectSurface(next) {
    surface = next;
    currentPage = null;
    appPage.hidden = true;
    settingsPage.hidden = true;
    closeOverlays();
    const template = next === 'template';
    $('#chatTab').classList.toggle('active', !template);
    $('#templateTab').classList.toggle('active', template);
    $('#chatTab').setAttribute('aria-selected', String(!template));
    $('#templateTab').setAttribute('aria-selected', String(template));
    const hasConversation = messagesView.innerHTML.trim().length > 0;
    emptyView.hidden = template || hasConversation;
    messagesView.hidden = template || !hasConversation;
    templateView.hidden = !template;
    composerZone.hidden = template;
    $('#contextButton').innerHTML = icon(template ? 'i-search' : 'i-more');
    $('#contextButton').setAttribute('aria-label', template ? '搜索模板' : '更多功能');
    caption.textContent = template ? '模板与聊天同层切换；模板页不显示消息输入框。' : '返回聊天草稿，不增加新的导航层级。';
  }

  input.addEventListener('focus', () => { setComposer(true); caption.textContent = '输入框平滑展开，模型强度和完整操作区同时出现。'; });
  input.addEventListener('input', syncSendButton);
  input.addEventListener('blur', () => { if (!input.value.trim()) setTimeout(() => setComposer(false), 120); });
  addSend.addEventListener('click', () => {
    if (input.value.trim()) { setDemo('conversation'); return; }
    showOverlay(attachSheet); caption.textContent = '附件面板提供真实可辨识的图片缩略图占位。';
  });
  $('#strengthButton').addEventListener('click', () => showOverlay(strengthSheet));
  $$('.strength-options button').forEach(button => button.addEventListener('click', () => {
    $$('.strength-options button').forEach(item => { item.classList.toggle('selected', item === button); item.lastElementChild.innerHTML = item === button ? icon('i-check') : ''; });
    $('#strengthLabel').textContent = button.dataset.strength;
    closeOverlays();
    caption.textContent = `模型强度已切换为“${button.dataset.strength}”。`;
  }));
  $('#menuButton').addEventListener('click', () => { showOverlay(drawer); caption.textContent = '所有聊天与项目分离；新建对话固定在侧边栏底部。'; });
  scrim.addEventListener('click', closeOverlays);
  $('#drawerSearchButton').addEventListener('click', () => { $('#drawerSearch').hidden = false; $('#drawerSearch input').focus(); });
  $('#drawerSearch input').addEventListener('input', event => {
    const query = event.target.value.trim().toLowerCase();
    $$('.drawer-row').forEach(row => { row.hidden = query && !row.textContent.toLowerCase().includes(query); });
  });
  $('#closeDrawerSearch').addEventListener('click', () => { $('#drawerSearch').hidden = true; $('#drawerSearch input').value = ''; $$('.drawer-row').forEach(row => { row.hidden = false; }); });
  $('#settingsButton').addEventListener('click', () => { closeOverlays(); setDemo('settings'); });
  $('#favoritesButton').addEventListener('click', () => renderPage('favorites'));
  $('#allChatsButton').addEventListener('click', () => renderPage('all-chats'));
  $('#newChatButton').addEventListener('click', () => { closeOverlays(); setDemo('empty'); });
  $('#chatTab').addEventListener('click', () => selectSurface('chat'));
  $('#templateTab').addEventListener('click', () => selectSurface('template'));
  $('#contextButton').addEventListener('click', () => {
    if (surface !== 'template') { showOverlay(conversationSheet); caption.textContent = '当前对话的设置、统计、导出、快捷方式和删除操作。'; return; }
    $('#templateSearch').hidden = false;
    $('#templateQuery').focus();
  });
  phone.addEventListener('pointerdown', event => {
    if (!conversationReturnPage || !appPage.hidden || surface !== 'chat') return;
    const bounds = phone.getBoundingClientRect();
    if (event.clientX - bounds.left > 32) return;
    edgeSwipeStart = { x: event.clientX, y: event.clientY, pointerId: event.pointerId };
  });
  phone.addEventListener('pointerup', event => {
    if (!edgeSwipeStart || edgeSwipeStart.pointerId !== event.pointerId) return;
    const horizontal = event.clientX - edgeSwipeStart.x;
    const vertical = Math.abs(event.clientY - edgeSwipeStart.y);
    edgeSwipeStart = null;
    if (horizontal >= 72 && vertical <= 64) {
      if (conversationHistoryArmed) window.history.back();
      else returnToProject();
    }
  });
  phone.addEventListener('pointercancel', () => { edgeSwipeStart = null; });
  $('#closeTemplateSearch').addEventListener('click', () => { $('#templateSearch').hidden = true; $('#templateQuery').value = ''; $$('.template-card').forEach(card => card.hidden = false); });
  $('#templateQuery').addEventListener('input', event => { const query = event.target.value.trim().toLowerCase(); $$('.template-card').forEach(card => card.hidden = query && !card.dataset.search.includes(query)); });
  $('#backSettings').addEventListener('click', () => setDemo('empty'));
  $('#settingsQuery').addEventListener('input', event => {
    const query = event.target.value.trim().toLowerCase();
    let matches = 0;
    $$('[data-group]').forEach(group => {
      let groupMatches = 0;
      group.querySelectorAll('[data-setting]').forEach(row => { const visible = !query || row.dataset.setting.toLowerCase().includes(query) || row.textContent.toLowerCase().includes(query); row.hidden = !visible; if (visible) groupMatches++; });
      group.hidden = groupMatches === 0;
      matches += groupMatches;
    });
    $('#settingsEmpty').hidden = matches > 0;
  });
  $('#backAppPage').addEventListener('click', goBackPage);
  $('#appPageMore').addEventListener('click', () => {
    if (pages[currentPage]?.project) {
      showOverlay(projectSheet);
      caption.textContent = `管理“${currentProjectName}”项目；常用内容留在详情页，低频操作收在这里。`;
      return;
    }
    showToast('页面级更多操作将在这里展开');
  });
  phone.addEventListener('input', event => {
    const projectInput = event.target.closest('[data-project-input]');
    if (!projectInput) return;
    const send = projectInput.closest('[data-project-composer]').querySelector('[data-project-send]');
    const ready = projectInput.value.trim().length > 0;
    send.innerHTML = icon(ready ? 'i-up' : 'i-plus');
    send.setAttribute('aria-label', ready ? '在项目中新建聊天' : '添加附件');
  });
  phone.addEventListener('focusin', event => {
    const projectInput = event.target.closest('[data-project-input]');
    if (!projectInput) return;
    projectInput.closest('[data-project-composer]').classList.add('expanded');
    caption.textContent = `在“${projectInput.dataset.projectName}”中创建新聊天；会自动继承项目上下文。`;
  });
  phone.addEventListener('focusout', event => {
    const projectInput = event.target.closest('[data-project-input]');
    if (!projectInput || projectInput.value.trim()) return;
    setTimeout(() => projectInput.closest('[data-project-composer]')?.classList.remove('expanded'), 120);
  });
  phone.addEventListener('keydown', event => {
    const projectInput = event.target.closest('[data-project-input]');
    if (!projectInput || event.key !== 'Enter' || event.shiftKey) return;
    event.preventDefault();
    projectInput.closest('[data-project-composer]').querySelector('[data-project-send]').click();
  });
  phone.addEventListener('click', event => {
    const failureTarget = event.target.closest('[data-show-failure]');
    if (failureTarget) {
      showOverlay(failureNotice);
      caption.textContent = '错误详情按需显示，不占用正常聊天内容空间。';
      return;
    }
    if (event.target.closest('[data-close-failure]')) { closeOverlays(); return; }
    const projectSend = event.target.closest('[data-project-send]');
    if (projectSend) {
      const projectInput = projectSend.closest('[data-project-composer]').querySelector('[data-project-input]');
      const prompt = projectInput.value.trim();
      if (!prompt) {
        showOverlay(attachSheet);
        caption.textContent = '附件面板提供图片、拍照和文件入口。';
        return;
      }
      const projectName = projectInput.dataset.projectName;
      const originProject = currentPage;
      setDemo('conversation', true);
      armProjectReturn(originProject);
      messagesView.querySelector('.user-message').textContent = prompt;
      messagesView.querySelector('.assistant-message p').innerHTML = `这是在“<strong>${projectName}</strong>”项目中新建的对话。正式产品会继承该项目的模型、提示词和已授权上下文，并在这里流式生成回答。`;
      caption.textContent = `已在“${projectName}”项目中新建并进入对话。`;
      showToast(`已在“${projectName}”中新建对话`);
      return;
    }
    const projectStrength = event.target.closest('[data-project-strength]');
    if (projectStrength) { showOverlay(strengthSheet); return; }
    const focusProject = event.target.closest('[data-focus-project]');
    if (focusProject) {
      const projectInput = appPageContent.querySelector('[data-project-input]');
      projectInput?.focus();
      projectInput?.scrollIntoView({ behavior: 'smooth', block: 'end' });
      return;
    }
    const openTarget = event.target.closest('[data-open-page]');
    if (openTarget) { renderPage(openTarget.dataset.openPage); return; }
    const demoTarget = event.target.closest('[data-demo-link]');
    if (demoTarget) {
      closeOverlays();
      const originProject = pages[currentPage]?.project ? currentPage : null;
      setDemo(demoTarget.dataset.demoLink, Boolean(originProject));
      if (originProject) armProjectReturn(originProject);
      if (demoTarget.dataset.conversationTitle) caption.textContent = `已进入会话“${demoTarget.dataset.conversationTitle}”；会话设置位于右上角菜单。`;
      return;
    }
    const actionTarget = event.target.closest('[data-prototype-action]');
    if (actionTarget) { closeOverlays(); showToast(actionTarget.dataset.prototypeAction); return; }
    const messageMenu = event.target.closest('[data-message-menu]');
    if (messageMenu) { showOverlay(messageSheet); return; }
    const toggle = event.target.closest('.toggle');
    if (toggle) { const on = !toggle.classList.contains('on'); toggle.classList.toggle('on', on); toggle.setAttribute('aria-checked', String(on)); showToast(on ? '已启用' : '已停用'); return; }
    const chip = event.target.closest('.chip');
    if (chip) { const group = chip.parentElement; group.querySelectorAll('.chip').forEach(item => item.classList.toggle('selected', item === chip)); return; }
    const tabButton = event.target.closest('.tabs button');
    if (tabButton) { tabButton.parentElement.querySelectorAll('button').forEach(item => item.classList.toggle('active', item === tabButton)); showToast(`已切换到“${tabButton.textContent.trim()}”`); }
  });
  $$('.demo-bar button[data-demo]').forEach(button => button.addEventListener('click', () => setDemo(button.dataset.demo)));
  $$('.demo-bar button[data-open-page]').forEach(button => button.addEventListener('click', () => renderPage(button.dataset.openPage)));
  syncSendButton();
</script>
</body>
</html>
